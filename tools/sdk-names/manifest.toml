# The SDK name manifest of proposal 0041 (SDK naming scheme).
#
# One entry per role. See README.md for the format, how to add a role or a
# name, and how the conformance tests are generated from this file. After
# editing it, run `cargo ci sdk-names` to regenerate the tests.

# Concrete items that fill in the placeholders of generated names, per column,
# taken from the project each column's generated names are checked against.

# crates/bindings/tests/sdk_names.rs declares this table itself.
[instances.rust_module]
Row = "SdkNamesRow"

# sdks/rust/tests/view-client, whose bindings come from modules/sdk-test-view.
[instances.rust_client]
Table = "Player"
Column = "Identity"
Row = "Player"
row = "player"

# crates/bindings-typescript/test-app.
[instances.ts_client]
Reducer = "CreatePlayer"

# crates/bindings-csharp/Codegen.Tests/fixtures/server.
[instances.csharp_module]
Table = "PublicTable"

# sdks/csharp/examples~/regression-tests/client.
[instances.csharp_client]
Table = "ExampleData"
Column = "Id"
Index = "Indexed"
Reducer = "Add"
Procedure = "AuthenticationCapabilities"

# crates/bindings-cpp/tests/compile/cases/indexes/ok_sdk_names.cpp declares this
# table itself.
[instances.cpp_module]
Row = "SdkNamesRow"

