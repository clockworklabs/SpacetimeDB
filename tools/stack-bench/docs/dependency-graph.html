<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stack Bench | Dependency Graph</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #050706;
    --panel: #0b1110;
    --panel-raised: #101716;
    --line: #22322f;
    --line-strong: #3b504b;
    --text: #eef3f1;
    --muted: #91a09d;
    --dim: #5e6b68;
    --green: #21f38a;
    --green-bg: #0d2b1c;
    --blue: #62c7ff;
    --blue-bg: #102938;
    --yellow: #f3c959;
    --yellow-bg: #352b13;
    --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .12;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  button { font: inherit; }

  .shell {
    position: relative;
    z-index: 1;
    width: min(1440px, 100%);
    min-height: 100vh;
    margin: 0 auto;
    padding: 24px;
  }

  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 18px;
  }

  h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.1; letter-spacing: -.025em; }
  .subtitle { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 18px;
    min-height: 52px;
    margin-bottom: 14px;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: rgba(11, 17, 16, .94);
  }

  .legend { display: flex; flex-wrap: wrap; gap: 18px; }
  .legend span { color: var(--muted); font: 10px/1 var(--mono); text-transform: uppercase; letter-spacing: .07em; }
  .legend i { display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; }
  .legend .qualified { background: var(--green); }
  .legend .draft { background: var(--yellow); }

  .graph-panel {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(11, 17, 16, .96);
  }

  .graph-panel { min-width: 0; overflow: auto; }

  .graph-canvas {
    position: relative;
    min-width: 1120px;
    min-height: 680px;
    padding: 22px;
  }

  #edges {
    position: absolute;
    inset: 0;
    z-index: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
  }

  .edge {
    fill: none;
    stroke-width: 1.75;
    opacity: .38;
    transition: opacity 120ms ease, stroke-width 120ms ease;
  }

  .edge.qualified { stroke: var(--green); }
  .edge.draft { stroke: var(--yellow); }
  .edge.muted { opacity: .025; }
  .edge.active { opacity: 1; stroke-width: 2.75; }

  .levels {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: repeat(3, minmax(220px, 1fr));
    gap: 112px;
  }

  .level-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 30px;
    margin-bottom: 13px;
    color: var(--muted);
    font: 10px/1 var(--mono);
    letter-spacing: .09em;
    text-transform: uppercase;
  }

  .level-head b { color: var(--dim); font-weight: 500; }

  .node {
    width: 100%;
    min-height: 68px;
    margin-bottom: 16px;
    padding: 12px 14px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 5px 12px;
    align-items: center;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: var(--panel-raised);
    color: var(--text);
    text-align: left;
    cursor: pointer;
    transition: opacity 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
  }

  .node .name { min-width: 0; font: 600 13px/1.25 var(--mono); }
  .node .state { grid-column: 2; font: 700 13px/1 var(--mono); }

  .node.qualified { border-color: #287b55; background: var(--green-bg); }
  .node.qualified .state { color: var(--green); }
  .node.draft { border-color: #766329; background: var(--yellow-bg); }
  .node.draft .state { color: var(--yellow); }
  .node.muted { opacity: .2; }
  .node.active { box-shadow: 0 0 0 1px currentColor; }

  .footnote { margin: 14px 2px 0; color: var(--muted); font-size: 12px; line-height: 1.5; }

  @media (max-width: 900px) {
    header { display: block; }
  }

  @media (max-width: 560px) {
    .shell { padding: 16px; }
    .toolbar { display: block; }
  }
</style>
</head>
<body>
<main class="shell">
  <header>
    <div>
      <h1>Ecommerce dependency graph</h1>
      <p class="subtitle">Select a feature to trace its prerequisites and the features it unlocks.</p>
    </div>
  </header>

  <div class="toolbar">
    <div class="legend" aria-label="Feature release states">
      <span><i class="qualified"></i>Qualified feature pack</span>
      <span><i class="draft"></i>Draft feature pack</span>
    </div>
  </div>

  <section class="graph-panel" aria-label="Feature graph">
    <div class="graph-canvas" id="graph-canvas">
      <svg id="edges" aria-hidden="true">
        <defs>
          <marker id="arrow-qualified" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M0,0 L10,5 L0,10 Z" fill="#21f38a"></path>
          </marker>
          <marker id="arrow-draft" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M0,0 L10,5 L0,10 Z" fill="#f3c959"></path>
          </marker>
        </defs>
      </svg>
      <div class="levels" id="levels"></div>
    </div>
  </section>
  <p class="footnote">L4 and L5 do not have defined feature modules or dependency links yet.</p>
</main>

<script>
  const features = [
    { id: 'accounts', name: 'Accounts', level: 1, state: 'qualified', parents: [], pack: 'ecommerce.feature.accounts@1.1.0', scope: 'Account creation, sign-in, sign-out, and durable account state.' },
    { id: 'catalog', name: 'Catalog', level: 1, state: 'qualified', parents: [], pack: 'ecommerce.feature.catalog@1.1.0', scope: 'Public products, stock, ratings, and sales ranking.' },
    { id: 'purchasing', name: 'Purchasing and orders', level: 1, state: 'qualified', parents: [], pack: 'ecommerce.feature.purchasing@1.1.0', scope: 'Authenticated purchases, order totals, and order history.' },
    { id: 'cart-checkout', name: 'Cart and checkout', level: 1, state: 'qualified', parents: [], pack: 'ecommerce.feature.cart-checkout@1.2.0', scope: 'Shared carts, quantities, checkout, and purchase creation.' },
    { id: 'reviews', name: 'Reviews', level: 1, state: 'qualified', parents: [], pack: 'ecommerce.feature.reviews@1.1.0', scope: 'Verified-purchase reviews and live rating updates.' },
    { id: 'warehouse-admin', name: 'Warehouse administration', level: 1, state: 'qualified', parents: [], pack: 'ecommerce.feature.warehouse-admin@1.1.0', scope: 'Warehouse stock, administrator access, and live inventory updates.' },

    { id: 'fulfilment-queue', name: 'Fulfilment queue', level: 2, state: 'qualified', parents: ['purchasing', 'warehouse-admin'], pack: 'ecommerce.operations-access-features@1.0.0', scope: 'Staff queues, shipping, and operator workflows.' },
    { id: 'warehouse-transfer', name: 'Stock transfers', level: 2, state: 'qualified', parents: ['warehouse-admin'], pack: 'ecommerce.inventory-operations-features@1.2.0', scope: 'Move stock between warehouses without changing the total.' },
    { id: 'cancellation-return', name: 'Cancellation and returns', level: 2, state: 'qualified', parents: ['purchasing', 'cart-checkout'], pack: 'ecommerce.returns-pricing-features@1.1.0', scope: 'Cancel orders, return shipped orders, and restore stock.' },
    { id: 'price-history', name: 'Price history', level: 2, state: 'qualified', parents: ['catalog', 'purchasing'], pack: 'ecommerce.returns-pricing-features@1.1.0', scope: 'Live catalog prices and immutable paid prices.' },
    { id: 'operational-views', name: 'Operational views', level: 2, state: 'qualified', parents: ['catalog', 'purchasing', 'warehouse-admin'], pack: 'ecommerce.inventory-operations-features@1.2.0', scope: 'Low stock, sales, recommendations, and best sellers.' },

    { id: 'reservations', name: 'Reservations', level: 3, state: 'draft', parents: ['warehouse-transfer', 'price-history'], pack: 'ecommerce.l3.reservations-features@1.0.0', scope: 'Timed stock reservations, renewal, expiry, and checkout conversion.' },
    { id: 'scheduled-restocks', name: 'Scheduled restocks', level: 3, state: 'draft', parents: ['fulfilment-queue', 'warehouse-transfer'], pack: 'ecommerce.l3.scheduled-restocks-features@1.0.0', scope: 'Schedule, cancel, and complete durable restocks.' },
    { id: 'order-delivery', name: 'Order delivery', level: 3, state: 'draft', parents: ['fulfilment-queue', 'cancellation-return'], pack: 'ecommerce.l3.order-delivery-features@1.0.0', scope: 'Automatic delivery after shipping, with cancellation protection.' },
    { id: 'cart-expiration', name: 'Cart expiration', level: 3, state: 'draft', parents: ['cancellation-return'], pack: 'ecommerce.l3.cart-expiration-features@1.0.0', scope: 'Abandoned-cart expiry and reservation release.' }
  ];

  const byId = new Map(features.map(feature => [feature.id, feature]));
  const levels = document.getElementById('levels');
  const canvas = document.getElementById('graph-canvas');
  const edges = document.getElementById('edges');

  for (let level = 1; level <= 3; level += 1) {
    const column = document.createElement('div');
    const items = features.filter(feature => feature.level === level);
    column.innerHTML = `<div class="level-head"><span>Level ${level}</span><b>${items.length} features</b></div>`;

    for (const feature of items) {
      const node = document.createElement('button');
      node.type = 'button';
      node.className = `node ${feature.state}`;
      node.dataset.id = feature.id;
      node.setAttribute('aria-label', `Trace dependencies for ${feature.name}`);
      node.setAttribute('aria-pressed', 'false');
      node.innerHTML = `<span class="name">${feature.name}</span><span class="state" title="${feature.state}">●</span>`;
      column.appendChild(node);
    }

    levels.appendChild(column);
  }

  function drawEdges() {
    edges.querySelectorAll('.edge').forEach(edge => edge.remove());
    const canvasBox = canvas.getBoundingClientRect();

    for (const child of features) {
      const childNode = document.querySelector(`[data-id="${child.id}"]`);
      const childBox = childNode.getBoundingClientRect();

      for (const parentId of child.parents) {
        const parentNode = document.querySelector(`[data-id="${parentId}"]`);
        const parentBox = parentNode.getBoundingClientRect();
        const outgoing = features
          .filter(feature => feature.parents.includes(parentId))
          .sort((a, b) => document.querySelector(`[data-id="${a.id}"]`).getBoundingClientRect().top - document.querySelector(`[data-id="${b.id}"]`).getBoundingClientRect().top);
        const incoming = [...child.parents]
          .sort((a, b) => document.querySelector(`[data-id="${a}"]`).getBoundingClientRect().top - document.querySelector(`[data-id="${b}"]`).getBoundingClientRect().top);
        const outgoingIndex = outgoing.findIndex(feature => feature.id === child.id);
        const incomingIndex = incoming.indexOf(parentId);
        const x1 = parentBox.right - canvasBox.left;
        const y1 = parentBox.top + parentBox.height * (outgoingIndex + 1) / (outgoing.length + 1) - canvasBox.top;
        const x2 = childBox.left - canvasBox.left;
        const y2 = childBox.top + childBox.height * (incomingIndex + 1) / (incoming.length + 1) - canvasBox.top;
        const middle = x1 + (x2 - x1) / 2;
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.classList.add('edge', child.state);
        path.dataset.parent = parentId;
        path.dataset.child = child.id;
        path.setAttribute('d', `M ${x1} ${y1} C ${middle} ${y1}, ${middle} ${y2}, ${x2} ${y2}`);
        path.setAttribute('marker-end', `url(#arrow-${child.state})`);
        edges.appendChild(path);
      }
    }
  }

  let selectedId = null;

  function dependencyChain(featureId) {
    const connected = new Set([featureId]);
    const connectedEdges = new Set();
    const visitParents = id => {
      const feature = byId.get(id);
      for (const parentId of feature.parents) {
        connectedEdges.add(`${parentId}:${id}`);
        if (!connected.has(parentId)) {
          connected.add(parentId);
          visitParents(parentId);
        }
      }
    };
    const visitChildren = id => {
      for (const child of features.filter(candidate => candidate.parents.includes(id))) {
        connectedEdges.add(`${id}:${child.id}`);
        if (!connected.has(child.id)) {
          connected.add(child.id);
          visitChildren(child.id);
        }
      }
    };
    visitParents(featureId);
    visitChildren(featureId);
    return { connected, connectedEdges };
  }

  function trace(featureId) {
    const { connected, connectedEdges } = dependencyChain(featureId);
    document.querySelectorAll('.edge').forEach(edge => {
      const matches = connectedEdges.has(`${edge.dataset.parent}:${edge.dataset.child}`);
      edge.classList.toggle('active', matches);
      edge.classList.toggle('muted', !matches);
    });
    document.querySelectorAll('.node').forEach(node => {
      node.classList.toggle('active', node.dataset.id === featureId);
      node.classList.toggle('muted', !connected.has(node.dataset.id));
    });
  }

  function clearTrace() {
    document.querySelectorAll('.edge, .node').forEach(element => element.classList.remove('active', 'muted'));
  }

  function showSelection() {
    document.querySelectorAll('.node').forEach(node => node.setAttribute('aria-pressed', String(node.dataset.id === selectedId)));
    selectedId ? trace(selectedId) : clearTrace();
  }

  document.querySelectorAll('.node').forEach(node => {
    node.addEventListener('mouseenter', () => trace(node.dataset.id));
    node.addEventListener('mouseleave', () => selectedId ? trace(selectedId) : clearTrace());
    node.addEventListener('focus', () => trace(node.dataset.id));
    node.addEventListener('blur', () => selectedId ? trace(selectedId) : clearTrace());
    node.addEventListener('click', () => {
      selectedId = selectedId === node.dataset.id ? null : node.dataset.id;
      showSelection();
    });
  });

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      selectedId = null;
      showSelection();
    }
  });

  drawEdges();
  new ResizeObserver(drawEdges).observe(canvas);

</script>
</body>
</html>
