<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stack Bench | Dependency Graph</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #050706;
    --panel: #0b1110;
    --panel-raised: #101716;
    --line: #22322f;
    --line-strong: #3b504b;
    --text: #eef3f1;
    --muted: #91a09d;
    --dim: #5e6b68;
    --green: #21f38a;
    --green-bg: #0d2b1c;
    --blue: #62c7ff;
    --blue-bg: #102938;
    --yellow: #f3c959;
    --yellow-bg: #352b13;
    --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .12;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  button { font: inherit; }

  .shell {
    position: relative;
    z-index: 1;
    width: min(1440px, 100%);
    min-height: 100vh;
    margin: 0 auto;
    padding: 24px;
  }

  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 18px;
  }

  h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.1; letter-spacing: -.025em; }
  .subtitle { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 18px;
    min-height: 52px;
    margin-bottom: 14px;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: rgba(11, 17, 16, .94);
  }

  .legend { display: flex; flex-wrap: wrap; gap: 18px; }
  .legend span { color: var(--muted); font: 10px/1 var(--mono); text-transform: uppercase; letter-spacing: .07em; }
  .legend i { display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; }
  .legend .qualified { background: var(--green); }
  .legend .draft { background: var(--yellow); }

  .graph-panel {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(11, 17, 16, .96);
  }

  .graph-panel { min-width: 0; overflow: auto; }

  .graph-canvas {
    position: relative;
    min-width: 1320px;
    min-height: 680px;
    padding: 18px;
  }

  #edges {
    position: absolute;
    inset: 0;
    z-index: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
  }

  .edge {
    fill: none;
    stroke-width: 1.75;
    opacity: .1;
    transition: opacity 120ms ease, stroke-width 120ms ease;
  }

  .edge.qualified { stroke: var(--green); }
  .edge.draft { stroke: var(--yellow); }
  .edge.muted { opacity: .025; }
  .edge.active { opacity: 1; stroke-width: 2.75; }

  .graph-grid {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 170px repeat(var(--depth-count, 4), minmax(160px, 1fr));
    gap: 0 30px;
  }

  .depth-head {
    display: flex;
    align-items: center;
    min-height: 38px;
    padding: 0 10px 10px;
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    font: 10px/1 var(--mono);
    letter-spacing: .09em;
    text-transform: uppercase;
  }

  .depth-head:first-child { padding-left: 0; }

  .questline-label,
  .questline-cell {
    min-height: 76px;
    padding: 10px;
    border-bottom: 1px solid rgba(34, 50, 47, .72);
  }

  .questline-label {
    display: flex;
    align-items: flex-start;
    padding-left: 0;
    color: var(--muted);
    font: 600 12px/1.25 var(--sans);
  }

  .questline-cell {
    display: grid;
    align-content: start;
    gap: 8px;
  }

  .node {
    width: 100%;
    min-height: 52px;
    margin: 0;
    padding: 9px 11px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 5px 12px;
    align-items: center;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: var(--panel-raised);
    color: var(--text);
    text-align: left;
    cursor: pointer;
    transition: opacity 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
  }

  .node .name { min-width: 0; font: 600 11.5px/1.25 var(--mono); }
  .node .state { grid-column: 2; font: 700 11px/1 var(--mono); }

  .node.qualified { border-color: #287b55; background: var(--green-bg); }
  .node.qualified .state { color: var(--green); }
  .node.draft { border-color: #766329; background: var(--yellow-bg); }
  .node.draft .state { color: var(--yellow); }
  .node.muted { opacity: .2; }
  .node.active { box-shadow: 0 0 0 1px currentColor; }

  .footnote { margin: 14px 2px 0; color: var(--muted); font-size: 12px; line-height: 1.5; }

  @media (max-width: 900px) {
    header { display: block; }
  }

  @media (max-width: 560px) {
    .shell { padding: 16px; }
    .toolbar { display: block; }
  }
</style>
</head>

<main class="shell">
  <header>
    <div>
      <h1>Ecommerce dependency graph</h1>
      <p class="subtitle">Each row is a questline. Select a feature to see what it needs and what it unlocks.</p>
    </div>
  </header>

  <div class="toolbar">
    <div class="legend" aria-label="Feature release states">

      <span><i class="draft"></i>Draft feature pack</span>
    </div>
  </div>

  <section class="graph-panel" aria-label="Feature graph">
    <div class="graph-canvas" id="graph-canvas">
      <svg id="edges" aria-hidden="true">
        <defs>
          <marker id="arrow-qualified" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M0,0 L10,5 L0,10 Z" fill="#21f38a"></path>

            <path d="M0,0 L10,5 L0,10 Z" fill="#f3c959"></path>
          </marker>
        </defs>
      </svg>
      <div class="graph-grid" id="graph-grid"></div>
    </div>
  </section>
</main>

  const features = graph.nodes;

  const byId = new Map(features.map(feature => [feature.id, feature]));
  const grid = document.getElementById('graph-grid');
  const canvas = document.getElementById('graph-canvas');
  const edges = document.getElementById('edges');

  grid.style.setProperty('--depth-count', graph.levels);
  const corner = document.createElement('div');
  corner.className = 'depth-head';
  corner.textContent = 'Questline';
  grid.appendChild(corner);
  for (let depth = 1; depth <= graph.levels; depth += 1) {
    const head = document.createElement('div');
    head.className = 'depth-head';
    head.textContent = `Depth ${depth}`;
    grid.appendChild(head);
  }

  for (const questline of graph.questlines) {
    const label = document.createElement('div');
    label.className = 'questline-label';
    label.textContent = questline.title;
    grid.appendChild(label);
    for (let depth = 1; depth <= graph.levels; depth += 1) {
      const cell = document.createElement('div');
      cell.className = 'questline-cell';
      const items = features.filter(feature => feature.questline === questline.id
        && feature.level === depth);
      for (const feature of items) {
      const node = document.createElement('button');
      node.type = 'button';
      node.className = `node ${feature.state}`;
      node.dataset.id = feature.id;
      node.title = feature.description;
      node.setAttribute('aria-label', `${feature.name}. ${feature.description}`);
      node.setAttribute('aria-pressed', 'false');
      node.innerHTML = `<span class="name">${feature.name}</span><span class="state">●</span>`;
        cell.appendChild(node);
      }
      grid.appendChild(cell);
    }
  }

  function drawEdges() {
    edges.querySelectorAll('.edge').forEach(edge => edge.remove());
    const canvasBox = canvas.getBoundingClientRect();

    for (const child of features) {
      const childNode = document.querySelector(`[data-id="${child.id}"]`);
      const childBox = childNode.getBoundingClientRect();

      for (const parentId of child.parents) {
        const parentNode = document.querySelector(`[data-id="${parentId}"]`);
        const parentBox = parentNode.getBoundingClientRect();
        const outgoing = features
          .filter(feature => feature.parents.includes(parentId))
          .sort((a, b) => document.querySelector(`[data-id="${a.id}"]`).getBoundingClientRect().top - document.querySelector(`[data-id="${b.id}"]`).getBoundingClientRect().top);
        const incoming = [...child.parents]
          .sort((a, b) => document.querySelector(`[data-id="${a}"]`).getBoundingClientRect().top - document.querySelector(`[data-id="${b}"]`).getBoundingClientRect().top);
        const outgoingIndex = outgoing.findIndex(feature => feature.id === child.id);
        const incomingIndex = incoming.indexOf(parentId);
        const x1 = parentBox.right - canvasBox.left;
        const y1 = parentBox.top + parentBox.height * (outgoingIndex + 1) / (outgoing.length + 1) - canvasBox.top;
        const x2 = childBox.left - canvasBox.left;
        const y2 = childBox.top + childBox.height * (incomingIndex + 1) / (incoming.length + 1) - canvasBox.top;
        const middle = x1 + (x2 - x1) / 2;
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.classList.add('edge', child.state);
        path.dataset.parent = parentId;
        path.dataset.child = child.id;
        path.setAttribute('d', `M ${x1} ${y1} C ${middle} ${y1}, ${middle} ${y2}, ${x2} ${y2}`);
        path.setAttribute('marker-end', `url(#arrow-${child.state})`);
        edges.appendChild(path);
      }
    }
  }

  let selectedId = null;

  function dependencyChain(featureId) {
    const connected = new Set([featureId]);
    const connectedEdges = new Set();
    const visitParents = id => {
      const feature = byId.get(id);
      for (const parentId of feature.parents) {
        connectedEdges.add(`${parentId}:${id}`);
        if (!connected.has(parentId)) {
          connected.add(parentId);
          visitParents(parentId);
        }
      }
    };
    const visitChildren = id => {
      for (const child of features.filter(candidate => candidate.parents.includes(id))) {
        connectedEdges.add(`${id}:${child.id}`);
        if (!connected.has(child.id)) {
          connected.add(child.id);
          visitChildren(child.id);
        }
      }
    };
    visitParents(featureId);
    visitChildren(featureId);
    return { connected, connectedEdges };
  }

  function trace(featureId) {
    const { connected, connectedEdges } = dependencyChain(featureId);
    document.querySelectorAll('.edge').forEach(edge => {
      const matches = connectedEdges.has(`${edge.dataset.parent}:${edge.dataset.child}`);
      edge.classList.toggle('active', matches);
      edge.classList.toggle('muted', !matches);
    });
    document.querySelectorAll('.node').forEach(node => {
      node.classList.toggle('active', node.dataset.id === featureId);
      node.classList.toggle('muted', !connected.has(node.dataset.id));
    });
  }

  function clearTrace() {
    document.querySelectorAll('.edge, .node').forEach(element => element.classList.remove('active', 'muted'));
  }

  function showSelection() {
    document.querySelectorAll('.node').forEach(node => node.setAttribute('aria-pressed', String(node.dataset.id === selectedId)));
    selectedId ? trace(selectedId) : clearTrace();
  }

  document.querySelectorAll('.node').forEach(node => {
    node.addEventListener('mouseenter', () => trace(node.dataset.id));
    node.addEventListener('mouseleave', () => selectedId ? trace(selectedId) : clearTrace());
    node.addEventListener('focus', () => trace(node.dataset.id));
    node.addEventListener('blur', () => selectedId ? trace(selectedId) : clearTrace());
    node.addEventListener('click', () => {
      selectedId = selectedId === node.dataset.id ? null : node.dataset.id;
      showSelection();
    });
  });

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      selectedId = null;
      showSelection();
    }
  });

  drawEdges();
  new ResizeObserver(drawEdges).observe(canvas);

</script>
