:root {
  --green: #4cf490; --blue: #02befa; --red: #ff4c4c;
  --n1: #e6e9f0; --n3: #b6c0cf; --n4: #6f7987; --n5: #363840;
  --shade1: #162d38; --shade4: #121e24; --shade7: #0b1114; --shade8: #0b0e12;
  --sans: 'Inter Variable', Inter, ui-sans-serif, system-ui, sans-serif;
  --mono: 'Source Code Pro Variable', 'Source Code Pro', ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--shade8); color: var(--n3); font: 14px/1.5 var(--sans); overflow: hidden; }
.scene { position: fixed; inset: 0; }
.scene svg { width: 100%; height: 100%; display: block; transition: opacity .35s ease; }
.scene svg.out { opacity: 0; }
.top { position: fixed; inset: 0 0 auto 0; z-index: 5; display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 28px; }
.top svg { width: 26px; height: 24px; }
.top b { color: var(--n1); font: 600 12px/1 var(--mono); letter-spacing: .12em; }
.crumbs { display: flex; align-items: center; gap: 8px; margin-left: 10px; color: var(--n4); font: 500 11.7px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
.crumbs a { color: var(--n4); text-decoration: none; cursor: pointer; }
.crumbs a:hover { color: var(--n1); }
.crumbs b { color: var(--n3); font-weight: 500; }
.card { position: fixed; left: 40px; top: 84px; z-index: 5; max-width: 480px; pointer-events: none; }
.card .k { color: var(--green); font: 500 11.7px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; }
.card h1 { margin: 10px 0 8px; color: var(--n1); font-size: 34px; line-height: 38px; font-weight: 600; letter-spacing: -.025em; text-wrap: balance; }
.card p { margin: 0; color: var(--n3); font-size: 16px; line-height: 24px; max-width: 44ch; }
.card .k, .card h1, .card p { opacity: 0; transform: translateY(8px); transition: opacity .5s ease, transform .5s ease; }
.card.on .k, .card.on h1, .card.on p { opacity: 1; transform: none; }
.card.on h1 { transition-delay: .06s; } .card.on p { transition-delay: .14s; }
.hint { position: fixed; left: 40px; bottom: 48px; z-index: 5; color: var(--n4); font: 500 11.7px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; opacity: 0; transition: opacity .5s; }
.hint.on { opacity: 1; }
.ctl { position: fixed; right: 40px; bottom: 48px; z-index: 5; display: flex; align-items: center; gap: 14px; }
.ctl button { width: 34px; height: 34px; border-radius: 4px; border: 1px solid var(--shade1); background: rgba(11,17,20,.7); color: var(--n1); font: 13px/1 var(--mono); cursor: pointer; }
.ctl button:hover { border-color: var(--n3); }
.dots { display: flex; gap: 8px; }
.dots i { width: 22px; height: 3px; border-radius: 2px; background: var(--n5); display: block; cursor: pointer; transition: background .3s; }
.dots i.on { background: var(--green); }
.dots i.done { background: var(--shade1); }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
svg text { font: 11px var(--mono); fill: var(--n3); pointer-events: none; }
svg .lab { font-size: 10.5px; fill: var(--n4); letter-spacing: .12em; text-transform: uppercase; }
svg .title { font: 600 13px var(--sans); fill: var(--n1); }
svg .title.door { fill: var(--n1); }
svg .num { font: 600 15px var(--sans); fill: var(--n1); }
svg .grid { stroke: #142129; stroke-width: 1; }
svg .lane { fill: none; stroke: #172a33; stroke-width: 10; stroke-linejoin: round; stroke-linecap: round; }
svg .lane.on { stroke: #1e3844; }
svg .chip rect { fill: #0b1114; stroke-width: 1; }
svg .chip text { font: 500 9px var(--mono); letter-spacing: .1em; text-transform: uppercase; fill: var(--n1); }
svg .dim { transition: opacity .6s ease; }
svg .door { cursor: pointer; }
svg .door.hot polygon { filter: url(#lift); }
@media (max-width: 900px) { .card { left: 20px; right: 20px; top: 64px; } .card h1 { font-size: 26px; line-height: 30px; } .ctl { right: 20px; bottom: 28px; } .hint { left: 20px; bottom: 28px; } }
</style>
</head>

<script>
/* ================================================================ engine */
const NS = 'http://www.w3.org/2000/svg';
const U = 26, CX = Math.cos(Math.PI / 6);
let OX = 800, OY = 168;
const iso = (x, y, z = 0) => [OX + (x - y) * U * CX, OY + (x + y) * U * .5 - z * U];
const P = pts => pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ');
const el = (tag, attrs = {}, txt) => { const n = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); if (txt !== undefined) n.textContent = txt; return n; };
const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
const mix = (c, k) => { const [r, g, b] = hex(c); const f = v => Math.round(Math.max(0, Math.min(255, v))); return `rgb(${f(r * k)},${f(g * k)},${f(b * k)})`; };
const easeIO = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const map = document.getElementById('map');
const defs = el('defs'); map.append(defs);
defs.innerHTML = `<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="lift" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#4cf490" flood-opacity=".35"/></filter>
<linearGradient id="lightTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="shadeRight" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></linearGradient>
<linearGradient id="drum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient>`;
const root = el('g'); map.append(root);
let layers = null, districts = {}, risers = [], anim = [], pulses = [], doors = [];

const SLATE = '#1c2f3a', BLUE = '#1d8fc2', GREEN = '#2fbf74', WHITE = '#c9ced8', RED = '#d84545', DARK = '#1a2027', INK = '#0f181e';
const TOKEN = { request: '#5fd0ff', probe: '#4cf490', finding: '#fbdc8e', evidence: '#b6c0cf', seal: '#4cf490', token: '#fbdc8e', blocked: '#ff4c4c', scenario: '#b6c0cf', outcome: '#4cf490', defect: '#ff4c4c', verdict: '#4cf490', hash: '#b6c0cf', artifact: '#b6c0cf', signature: '#4cf490',
  pack: '#b6c0cf', guidance: '#b6c0cf', material: '#b6c0cf', plan: '#5fd0ff', score: '#c9ced8', receipt: '#fbdc8e', excluded: '#6f7987', job: '#5fd0ff', claim: '#4cf490', lease: '#fbdc8e' };

const tag = (node, d) => { node.classList.add('dim'); (districts[d] ??= []).push(node); return node; };

  const faces = [el('polygon', { fill: mix(color, side) }), el('polygon', { fill: mix(color, back) }), el('polygon', { fill: mix(color, top) })];
  const light = lit ? [el('polygon', { fill: 'url(#shadeRight)' }), el('polygon', { fill: 'url(#lightTop)' })] : [];
  faces.forEach(f => { f.setAttribute('stroke', 'rgba(0,0,0,.3)'); f.setAttribute('stroke-width', '.6'); });
  g.append(...faces, ...light); layers[layer].append(g); tag(g, district);
  if (shadow) { const sh = el('polygon', { fill: 'rgba(0,0,0,.45)', filter: 'url(#soft)', points: P([iso(x + .3, y + .3, z0), iso(x + w + .4, y + .3, z0), iso(x + w + .4, y + d + .4, z0), iso(x + .3, y + d + .4, z0)]) }); layers.shadows.append(tag(sh, district)); }
  const shape = hh => {
    const T = [iso(x, y, z0 + hh), iso(x + w, y, z0 + hh), iso(x + w, y + d, z0 + hh), iso(x, y + d, z0 + hh)];
