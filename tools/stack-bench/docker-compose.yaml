# Databases for the Postgres and MongoDB backends.
#
# Own ports, container names and volumes so a benchmark run never shares state
# with — or collides with — anything else running on the machine. The SpacetimeDB
# backend needs no service here; run `spacetime start` for it.
#
#   docker compose -f tools/stack-bench/docker-compose.yaml up -d
#
name: stack-bench

services:
  postgres:
    image: postgres:16@sha256:803ea6da631eab4a350da4ba87541e4737197b8c26ec0feb23ff6f9714212d1d
    container_name: stack-bench-postgres
    ports:
      - "6532:5432"
    environment:
      POSTGRES_USER: stackbench
      POSTGRES_PASSWORD: stackbench
      POSTGRES_DB: stackbench
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stackbench"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Single node, no replica set: change streams would give MongoDB a push
  # mechanism the Postgres backend does not have, and the comparison is about
  # what an agent builds on a standard stack.
  mongodb:
    image: mongo:7@sha256:8ecb514b00bdcc0bde67ef4e6c330385377a9dc68e24ee94e28c07c891647348
    container_name: stack-bench-mongodb
    ports:
      - "6537:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  mongodata:
