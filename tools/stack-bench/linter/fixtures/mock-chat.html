<!DOCTYPE html>
<html>
<head><title>Linter fixture — mock chat</title></head>
<body>
<!-- Minimal mock implementing the L1-L3 contract core flow.
     ?omit=<testid> renders that hook without its data-role, to test FAIL paths. -->
<div id="landing">
  <input data-role="name-input" placeholder="Your name">
  <button data-role="name-submit">Join</button>
</div>

<div id="main" hidden>
  <aside>
    <button data-role="room-create">+ New room</button>
    <div id="room-form" hidden>
      <input data-role="room-name-input" placeholder="Room name">
      <button data-role="room-name-submit">Create</button>
    </div>
    <ul data-role="room-list" id="rooms"></ul>
    <ul data-role="online-users"><li>mock-user</li></ul>
  </aside>
  <main id="room" hidden>
    <ul data-role="message-list" id="messages"></ul>
    <input data-role="message-input" placeholder="Message...">
    <button data-role="leave-room" hidden>Leave</button>
    <button data-role="schedule-toggle">Schedule</button>
    <div id="schedule-ui" hidden>
      <input data-role="schedule-time" type="datetime-local">
    </div>
    <button data-role="ephemeral-toggle">Ephemeral</button>
    <div id="ephemeral-ui" hidden>
      <select data-role="ephemeral-duration">
        <option>10s</option><option>30s</option><option>1m</option>
      </select>
    </div>
  </main>
</div>

<script>
  const omit = new URLSearchParams(location.search).getAll('omit');
  for (const id of omit) {
    document.querySelector(`[data-role="${id}"]`)?.removeAttribute('data-role');
  }
  const $ = t => document.querySelector(`[data-role="${t}"], #${t}`);
  $('name-submit')?.addEventListener('click', () => {
    document.getElementById('landing').hidden = true;
    document.getElementById('main').hidden = false;
  });
  $('room-create')?.addEventListener('click', () => {
    document.getElementById('room-form').hidden = false;
  });
  function createRoom() {
    const name = $('room-name-input')?.value || 'unnamed';
    const li = document.createElement('li');
    li.setAttribute('data-role', 'room-item');
    li.textContent = name;
    li.addEventListener('click', () => { document.getElementById('room').hidden = false; });
    document.getElementById('rooms').appendChild(li);
  }
  $('room-name-submit')?.addEventListener('click', createRoom);
  $('message-input')?.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const li = document.createElement('li');
    li.setAttribute('data-role', 'message-item');
    li.textContent = e.target.value;
    document.getElementById('messages').appendChild(li);
    e.target.value = '';
  });
</script>
</body>
</html>
