name: stack-bench-appliance

services:
  deps-init:
    image: ${STACK_BENCH_CONTROLLER_IMAGE:?set STACK_BENCH_CONTROLLER_IMAGE to the manifest digest reference}
    platform: linux/amd64
    command: ["init-deps"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - type: volume
        source: release-deps
        target: /opt/stack-bench-release-deps
    tmpfs:
      - /tmp:size=64m,mode=1777

  controller:
    image: ${STACK_BENCH_CONTROLLER_IMAGE:?set STACK_BENCH_CONTROLLER_IMAGE to the manifest digest reference}
    platform: linux/amd64
    init: true
    network_mode: host
    working_dir: ${STACK_BENCH_STATE_ROOT:?run controller setup}/results
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      deps-init:
        condition: service_completed_successfully
      npm-cache:
        condition: service_healthy
    environment:
      STACK_BENCH_CONTROLLER_IMAGE: ${STACK_BENCH_CONTROLLER_IMAGE:?set STACK_BENCH_CONTROLLER_IMAGE to the manifest digest reference}
      STACK_BENCH_BUILD_IMAGE: ${STACK_BENCH_BUILD_IMAGE:?set STACK_BENCH_BUILD_IMAGE}
      STACK_BENCH_STATE_ROOT: ${STACK_BENCH_STATE_ROOT:?run controller setup}
      STACK_BENCH_RUNNER_CAPACITY: ${STACK_BENCH_RUNNER_CAPACITY:-1}
      STACK_BENCH_NPM_REGISTRY: http://127.0.0.1:4873/
      STACK_BENCH_IMAGE: ${STACK_BENCH_BUILD_IMAGE:?set STACK_BENCH_BUILD_IMAGE to the manifest digest reference}
      STACK_BENCH_RELEASE_MANIFEST: ${STACK_BENCH_RELEASE_MANIFEST:-}
      STACK_BENCH_APPLIANCE: "1"
      STACK_BENCH_COMPOSE_FILE: /opt/stack-bench/appliance/docker-compose.yaml
      STACK_BENCH_WORK_DIR: ${STACK_BENCH_STATE_ROOT:?run controller setup}/work
      STACK_BENCH_RESULTS_DIR: ${STACK_BENCH_STATE_ROOT:?run controller setup}/results
      STACK_BENCH_SUPERVISOR_DIR: ${STACK_BENCH_STATE_ROOT:?run controller setup}/controller-home/supervisor
      STACK_BENCH_RUNTIME_DIR: ${STACK_BENCH_STATE_ROOT:?run controller setup}/controller-home/runtime
      STACK_BENCH_RESOURCE_LOCK_DIR: ${STACK_BENCH_STATE_ROOT:?run controller setup}/controller-home/resource-locks
      STACK_BENCH_RELEASE_DEPS_VOLUME: ${STACK_BENCH_RELEASE_DEPS_VOLUME:-stack-bench-release-deps}
      STACK_BENCH_LINUX_CLI: /opt/stack-bench-release-deps/spacetimedb-cli
      STDB_PACKAGE: /opt/stack-bench-release-deps/bindings-typescript
      SPACETIME_BIN: /opt/stack-bench-release-deps/spacetimedb-cli
      STACK_BENCH_AGENT_AUTH: ${STACK_BENCH_AGENT_AUTH:-subscription-token}
      STACK_BENCH_CLAUDE_OAUTH_TOKEN_FILE: ${STACK_BENCH_CLAUDE_OAUTH_TOKEN_FILE:-${STACK_BENCH_STATE_ROOT:?run controller setup}/secrets/claude_subscription_token}
      STACK_BENCH_ANTHROPIC_API_KEY_FILE: ${STACK_BENCH_ANTHROPIC_API_KEY_FILE:-}
      STACK_BENCH_OPENROUTER_API_KEY_FILE: ${STACK_BENCH_OPENROUTER_API_KEY_FILE:-}
      STACK_BENCH_OPENAI_API_KEY_FILE: ${STACK_BENCH_OPENAI_API_KEY_FILE:-}
      STACK_BENCH_CODEX_AUTH_FILE: ${STACK_BENCH_CODEX_AUTH_FILE:-}
      HOME: ${STACK_BENCH_STATE_ROOT:?run controller setup}/controller-home
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: volume
        source: state
        target: ${STACK_BENCH_STATE_ROOT:?run controller setup}
      - type: volume
        source: release-deps
        target: /opt/stack-bench-release-deps
        read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    command: ["--help"]
    logging: &bounded-logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    extends:
      service: controller
    profiles: ["dashboard"]
    network_mode: bridge
    environment:
      STACK_BENCH_DASHBOARD_CONTROL_SECRET_FILE: ${STACK_BENCH_DASHBOARD_CONTROL_SECRET_FILE:-${STACK_BENCH_STATE_ROOT:?run controller setup}/secrets/dashboard_control_secret}
    ports:
      - "127.0.0.1:7331:7331"
    command: ["dashboard", "--host", "0.0.0.0", "--port", "7331", "--allow-container-bind"]
  # Pull-through npm registry cache. Coding containers install through it, so a
  # package reaches the public registry once per appliance, not once per run.
  npm-cache:
    image: verdaccio/verdaccio:6@sha256:09b403888c8f73ba9336d7fb3464622f64ea905a64bc46a87c847387c536d4dd
    platform: linux/amd64
    container_name: stack-bench-npm-cache
    cpus: 1
    mem_limit: 2g
    pids_limit: 128
    logging: *bounded-logs
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:4873:4873"]
    configs:
      - source: npm-cache-config
        target: /verdaccio/conf/config.yaml
    volumes:
      - npmcache:/verdaccio/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4873/-/ping"]
      interval: 5s
      timeout: 5s
      retries: 12

configs:
  npm-cache-config:
    content: |
      storage: /verdaccio/storage/data
      plugins: /verdaccio/plugins
      web:
        enable: false
      auth:
        htpasswd:
          file: /verdaccio/storage/htpasswd
          max_users: -1
      uplinks:
        npmjs:
          url: https://registry.npmjs.org/
          cache: true
          timeout: 60s
          maxage: 10m
          max_fails: 4
          fail_timeout: 2m
      packages:
        '@*/*':
          access: $$all
          publish: nobody
          unpublish: nobody
          proxy: npmjs
        '**':
          access: $$all
          publish: nobody
          unpublish: nobody
          proxy: npmjs
      server:
        keepAliveTimeout: 60
      log:
        type: stdout
        format: pretty
        level: warn

volumes:
  release-deps:
    name: ${STACK_BENCH_RELEASE_DEPS_VOLUME:-stack-bench-release-deps}
  state:
    external: true
    name: stack-bench-state
  npmcache:
    name: stack-bench-appliance-npmcache
