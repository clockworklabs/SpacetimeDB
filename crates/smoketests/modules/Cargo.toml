# Nested workspace for pre-compiled smoketest modules.
# This workspace is excluded from the root workspace and built separately
# during the smoketest warmup phase.
#
# All modules here are compiled to WASM once during warmup, then reused
# by tests without per-test compilation overhead.

[workspace]
resolver = "3"
members = [
    # Filtering and query tests
    "filtering",
    "dml",

    # Views tests
    "views-basic",
    # "views-broken-namespace" - intentionally broken, uses runtime compilation
    "views-broken-return-type",
    "views-sql",
    "views-auto-migrate",
    "views-auto-migrate-updated",
    "views-primary-key-auto-migrate",
    "views-primary-key-auto-migrate-updated",
    "views-drop-view",
    "views-trapped",
    "views-recovered",
    "views-subscribe",
    "views-query",
    "views-callable",
    "views-count",
    "views-auto-migrate-stable",
    "views-auto-migrate-stable-updated",
    "views-auto-migrate-read-set",
    "views-auto-migrate-read-set-updated",

    # Security and permissions
    "rls",
    "rls-broken-private-table",
    "rls-no-filter",
    "rls-with-filter",
    "permissions-private",
    "permissions-lifecycle",

    # Call/procedure tests
    "call-reducer-procedure",
    "call-reducer-procedure-identity-arg",
    "call-empty",
    "call-many",

    # Auto-migration tests
    "auto-migration-simple",
    "auto-migration-incompatible",
    "auto-migration-add-table-initial",
    "auto-migration-add-table-updated",
    "auto-migration-add-columns",
    "auto-migration-add-columns-again",
    "auto-migration-with-primary-key",
    "auto-migration-without-primary-key",
    "auto-migration-without-primary-key-v2",
    "auto-migration-event-table-before",
    "auto-migration-event-table-after",
    "auto-migration-drop-event-table-before",
    "auto-migration-drop-event-table-after",

    # HTTP tests
    "http-egress",
    "http-routes",
    "http-routes-example",
    "http-routes-strict-root",
    "http-routes-strict-non-root",
    "http-routes-full-uri",
    "http-routes-request-body",

    # SQL format tests
    "sql-format",
    "pg-wire",

    # Scheduled reducer tests
    "schedule-cancel",
    "schedule-subscribe",
    "schedule-procedure",
    "schedule-volatile",

    # Module lifecycle tests
    "describe",
    "modules-basic",
    "modules-breaking",
    "modules-add-table",
    "upload-module-2",
    "hotswap-basic",
    "hotswap-updated",

    # Index tests
    "add-remove-index",
    "add-remove-index-indexed",

    # Panic/error handling
    "panic",
    "panic-error",

    # Restart tests
    "restart-person",
    "restart-connected-client",

    # Connection tests
    "connect-disconnect",
    "confirmed-reads",
    "delete-database",
    "client-connection-reject",
    "client-connection-disconnect-panic",
    "client-connection-http-cancel",
    "sql-connect-hook",

    # Log filtering tests
    "logs-level-filter",

    # Misc tests
    "namespaces",
    "new-user-flow",
    "module-nested-op",
    "noop",
    "fail-initial-publish-broken",
    "fail-initial-publish-fixed",

    # Auto-increment tests (all 10 integer types in one module each)
    "autoinc-basic",
    "autoinc-unique",
]

[workspace.dependencies]
spacetimedb = { path = "../../../crates/bindings", features = ["unstable"] }
log = "0.4"
