[package]
name = "spacetimedb-test-datastore"
version.workspace = true
edition.workspace = true
license-file = "LICENSE"
description = "In-memory datastore support for SpacetimeDB module unit tests."
rust-version.workspace = true

[lib]
name = "spacetimedb_test_datastore"
path = "src/lib.rs"
bench = false

[dependencies]
spacetimedb_core = { package = "spacetimedb-core", path = "../core", version = "=2.13.0", optional = true }
spacetimedb-engine = { workspace = true, features = ["test"] }
spacetimedb-datastore.workspace = true
spacetimedb-expr = { workspace = true, optional = true }
spacetimedb-lib.workspace = true
spacetimedb-primitives.workspace = true
spacetimedb-query = { workspace = true, optional = true }
spacetimedb-schema.workspace = true

anyhow.workspace = true
scopeguard = { workspace = true, optional = true }
thiserror.workspace = true

[features]
default = ["queries"]
# The SQL adapter still uses server-core helpers, whose V8 dependency cannot be
# linked into a native shared library. Datastore operations only need the engine.
queries = ["dep:spacetimedb_core", "dep:spacetimedb-expr", "dep:spacetimedb-query", "dep:scopeguard"]

[dev-dependencies]
spacetimedb-lib = { path = "../lib", features = ["test"] }

[lints]
workspace = true
