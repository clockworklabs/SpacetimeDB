[package]
name = "spacetimedb-client-api"
version.workspace = true
edition.workspace = true
license-file = "LICENSE"
description = "The HTTP API for SpacetimeDB"
rust-version.workspace = true

[dependencies]
spacetimedb-client-api-messages.workspace = true
spacetimedb-core.workspace = true
spacetimedb-data-structures.workspace = true
spacetimedb-datastore.workspace = true
spacetimedb-lib = { workspace = true, features = ["serde"] }
spacetimedb-paths.workspace = true
spacetimedb-schema.workspace = true

base64.workspace = true
http-body-util.workspace = true
tokio = { workspace = true, features = ["full"] }
log = "0.4.4"
serde = "1.0.136"
serde_json = { version = "1.0", features = ["raw_value"] }
anyhow = { version = "1.0.57", features = ["backtrace"] }
prometheus.workspace = true
async-trait = "0.1.60"
rand.workspace = true
axum.workspace = true
axum-extra.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http.workspace = true
headers.workspace = true
mime = "0.3.17"
tower-http.workspace = true
futures = "0.3"
bytes = "1"
tracing.workspace = true
bytestring = "1"
tokio-tungstenite.workspace = true
derive_more = "0.99.17"
uuid.workspace = true
jsonwebtoken.workspace = true
scopeguard.workspace = true
serde_with.workspace = true
async-stream.workspace = true
crossbeam-queue.workspace = true
humantime.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_env = "msvc"))'.dependencies]
jemalloc_pprof.workspace = true

[target.'cfg(all(target_os = "linux", any(target_arch = "aarch64", target_arch = "x86", target_arch = "x86_64")))'.dependencies]
tokio = { workspace = true, features = ["taskdump"] }

[dev-dependencies]
 tower = "0.5"
jsonwebtoken.workspace = true
pretty_assertions = { workspace = true, features = ["unstable"] }
proptest.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
toml.workspace = true

[lints]
workspace = true

[features]
unstable = []
