name: Release

run-name: ${{ format('Release {0} [{1}]', github.event.inputs.release_tag, github.event.inputs.dry_run == 'true' && 'dry-run' || 'live') }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v1.9.0)"
        required: true
      dry_run:
        description: "Run in dry-run mode"
        required: true
        type: boolean
        default: true
      release_crates:
        description: "Release crates.io packages"
        required: true
        type: boolean
        default: false
      release_csharp:
        description: "Release C# SDK"
        required: true
        type: boolean
        default: false
      release_cpp:
        description: "Release C++ bindings"
        required: true
        type: boolean
        default: false
      release_npm:
        description: "Release NPM package"
        required: true
        type: boolean
        default: false
      release_docker:
        description: "Release Docker container"
        required: true
        type: boolean
        default: false
      release_github:
        description: "Publish GitHub release (if nothing fails)"
        required: true
        type: boolean
        default: false
      update_mirror_latest_version:
        description: "Update S3 mirror latest-version marker"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: manual-release-${{ inputs.release_tag }}${{ inputs.dry_run && format('-dry-run-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  release-dry-run:
    name: release-dry-run
    if: >-
      ${{
        inputs.dry_run
        && (inputs.release_crates
          || inputs.release_csharp
          || inputs.release_cpp
          || inputs.release_npm
          || inputs.release_docker)
      }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      packages: write
    env:
      CARGO_TERM_COLOR: always
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Build the release tool from the dispatched ref, matching the live release path.
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dsherret/rust-toolchain-file@v1

      - name: Set default Rust toolchain
        run: rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"

      - name: Install cargo-release
        run: cargo install --path tools/release

      # Keep the release sources separate from the tooling checkout so each target
      # can be reset without removing the cargo-release sources or executable.
      - name: Checkout release sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}
          path: release-source
          submodules: recursive

      - name: Set up Node.js
        if: inputs.release_npm
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      - name: Install NPM release tools
        if: inputs.release_npm
        run: |
          # This is the minimum npm version required to use trusted publishing.
          npm install --global npm@11.5.1
          npm install --global pnpm
          npm --version
          pnpm --version

      - name: Set up .NET
        if: inputs.release_csharp
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: release-source/global.json

      - name: Install NuGet
        if: inputs.release_csharp
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-complete

          nuget_bin="$RUNNER_TEMP/release-tools"
          mkdir -p "$nuget_bin"
          wget -q https://dist.nuget.org/win-x86-commandline/latest/nuget.exe \
            -O "$nuget_bin/nuget-mono.exe"
          cat >"$nuget_bin/nuget" <<'EOF'
          #!/bin/bash
          exec mono "$(dirname "$(readlink -f "$0")")/nuget-mono.exe" "$@"
          EOF
          chmod +x "$nuget_bin/nuget"
          echo "$nuget_bin" >>"$GITHUB_PATH"

      - name: Set up SDK repository SSH keys
        if: inputs.release_csharp || inputs.release_cpp
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ inputs.release_csharp && secrets.UNITY_SDK_DEPLOY_KEY || '' }}
            ${{ inputs.release_cpp && secrets.CPP_SDK_DEPLOY_KEY || '' }}

      - name: Configure git
        if: inputs.release_csharp || inputs.release_cpp
        run: |
          git config --global user.name "Release Bot"
          git config --global user.email "no-reply@clockworklabs.io"
          git config --global --unset-all url.https://github.com/.insteadOf || true
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Set up Docker Buildx
        if: inputs.release_docker
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Run release dry-runs
        working-directory: release-source
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          RELEASE_CRATES: ${{ github.event.inputs.release_crates }}
          RELEASE_CSHARP: ${{ github.event.inputs.release_csharp }}
          RELEASE_CPP: ${{ github.event.inputs.release_cpp }}
          RELEASE_NPM: ${{ github.event.inputs.release_npm }}
          RELEASE_DOCKER: ${{ github.event.inputs.release_docker }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -uo pipefail

          failures=()

          reset_release_sources() {
            git reset --hard "$RELEASE_TAG"
            git clean -ffdx
            git submodule sync --recursive
            git submodule update --init --recursive --force
            git submodule foreach --recursive 'git reset --hard HEAD && git clean -ffdx'
          }

          run_dry_run() {
            local enabled="$1"
            local target="$2"

            if [[ "$enabled" != "true" ]]; then
              return
            fi

            echo "::group::$target dry-run"
            if cargo-release release "$target" "$RELEASE_TAG" --dry-run; then
              echo "$target: success" >>"$GITHUB_STEP_SUMMARY"
            else
              failures+=("$target")
              echo "$target: failure" >>"$GITHUB_STEP_SUMMARY"
              echo "::error title=$target release dry-run failed::See the $target log group for details."
            fi
            echo "::endgroup::"

            if ! reset_release_sources; then
              failures+=("$target workspace reset")
              echo "::error title=Release source reset failed::Could not clean the checkout after $target."
            fi
          }

          run_dry_run "$RELEASE_CRATES" crates
          run_dry_run "$RELEASE_CSHARP" csharp
          run_dry_run "$RELEASE_CPP" cpp
          run_dry_run "$RELEASE_NPM" npm
          run_dry_run "$RELEASE_DOCKER" docker

          if (( ${#failures[@]} > 0 )); then
            printf 'Release dry-run failures: %s\n' "${failures[*]}" >&2
            exit 1
          fi

  # This job runs before all of our live release jobs. If there is a release problem we should
  # try to fail during this step to prevent partial releases.
  build-cargo-release:
    if: ${{ !inputs.dry_run }}
    runs-on: spacetimedb-new-runner-2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dsherret/rust-toolchain-file@v1
      - name: Set default rust toolchain
        run: rustup default $(rustup show active-toolchain | cut -d' ' -f1)

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./

      - name: Install cargo-release
        run: |
          cargo install --path tools/release
          # ensure the binary exists
          which cargo-release
          # copy it into a sharable directory
          mkdir -p shared-bin
          cp "$(which cargo-release)" shared-bin/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cargo-release-bin
          path: shared-bin/

  release-crates:
    needs: build-cargo-release
    runs-on: spacetimedb-new-runner-2
    if: ${{ !inputs.dry_run && inputs.release_crates }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout specific tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}
          submodules: recursive

      - name: Set up Rust
        uses: dsherret/rust-toolchain-file@v1
      - name: Set default rust toolchain
        run: rustup default $(rustup show active-toolchain | cut -d' ' -f1)

      - name: Download cargo-release
        uses: actions/download-artifact@v4
        with:
          name: cargo-release-bin
          path: ./shared-bin

      - name: Make binary executable and on PATH
        run: |
          chmod +x ./shared-bin/cargo-release
          echo "$PWD/shared-bin" >> "$GITHUB_PATH"

      - name: Run release
        run: cargo-release release crates ${{ github.event.inputs.release_tag }}

  release-csharp:
    needs: build-cargo-release
    runs-on: spacetimedb-new-runner-2
    if: ${{ !inputs.dry_run && inputs.release_csharp }}
    env:
      CARGO_TERM_COLOR: always
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    steps:
      - name: Checkout specific tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}
          submodules: recursive

      - name: Set up Rust
        uses: dsherret/rust-toolchain-file@v1
      - name: Set default rust toolchain
        run: rustup default $(rustup show active-toolchain | cut -d' ' -f1)

      - name: Download cargo-release
        uses: actions/download-artifact@v4
        with:
          name: cargo-release-bin
          path: ./shared-bin

      - name: Make binary executable and on PATH
        run: |
          chmod +x ./shared-bin/cargo-release
          echo "$PWD/shared-bin" >> "$GITHUB_PATH"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install NuGet
        shell: bash
        run: |
          sudo apt install -y mono-complete
          mkdir bin
          cd bin
          wget https://dist.nuget.org/win-x86-commandline/latest/nuget.exe
          # We're on linux, so we need to do a mono dance to make NuGet invocations look the same as they would on e.g. windows
          mv nuget.exe nuget-mono.exe
          cat <<'EOF' | sed 's/^ *//' >nuget
            #!/bin/bash
            DIR="$(dirname "$(readlink -f "$0")")"
            mono "$DIR/nuget-mono.exe" "$@"
          EOF
          chmod +x nuget
          echo "$PWD" >> $GITHUB_PATH

      - name: Setup SSH key for Unity SDK repo
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.UNITY_SDK_DEPLOY_KEY }}

      - name: Configure git
        run: |
          git config --global user.name "Release Bot"
          git config --global user.email "no-reply@clockworklabs.io"
          # Remove any HTTPS to SSH conversion set by checkout action
          git config --global --unset-all url.https://github.com/.insteadOf || true
          # Ensure SSH is used instead of HTTPS for GitHub
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          # Verify configuration
          echo "Git URL rewrite config:"
          git config --global --get-regexp url

      - name: Run C# SDK release
        run: cargo-release release csharp ${{ github.event.inputs.release_tag }}

  release-cpp:
    needs: build-cargo-release
    runs-on: spacetimedb-new-runner-2
    if: ${{ !inputs.dry_run && inputs.release_cpp }}
    env:
      CARGO_TERM_COLOR: always
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout specific tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}
          submodules: recursive

      - name: Set up Rust
        uses: dsherret/rust-toolchain-file@v1
      - name: Set default rust toolchain
        run: rustup default $(rustup show active-toolchain | cut -d' ' -f1)

      - name: Download cargo-release
        uses: actions/download-artifact@v4
        with:
          name: cargo-release-bin
          path: ./shared-bin

      - name: Make binary executable and on PATH
        run: |
          chmod +x ./shared-bin/cargo-release
          echo "$PWD/shared-bin" >> "$GITHUB_PATH"

      - name: Setup SSH key for C++ SDK repo
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CPP_SDK_DEPLOY_KEY }}

      - name: Configure git
        run: |
          git config --global user.name "Release Bot"
          git config --global user.email "no-reply@clockworklabs.io"
          # Remove any HTTPS to SSH conversion set by checkout action
          git config --global --unset-all url.https://github.com/.insteadOf || true
          # Ensure SSH is used instead of HTTPS for GitHub
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          # Verify configuration
          echo "Git URL rewrite config:"
          git config --global --get-regexp url

      - name: Run C++ SDK release
        run: cargo-release release cpp ${{ github.event.inputs.release_tag }}

  release-npm:
    needs: build-cargo-release
    runs-on: ubuntu-latest
    if: ${{ !inputs.dry_run && inputs.release_npm }}
    env:
      CARGO_TERM_COLOR: always
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      id-token: write
      contents: write
      packages: write

    steps:
      - name: Checkout specific tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}
          submodules: recursive

      - name: Download cargo-release
        uses: actions/download-artifact@v4
        with:
          name: cargo-release-bin
          path: ./shared-bin

      - name: Make binary executable and on PATH
        run: |
          chmod +x ./shared-bin/cargo-release
          echo "$PWD/shared-bin" >> "$GITHUB_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      - name: Install npm with trusted publishing support
        run: |
          # this is the minimum version required to use trusted publishing
          npm install --global npm@11.5.1
          npm --version

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Run NPM release
        run: cargo-release release npm ${{ github.event.inputs.release_tag }}

  release-docker:
    needs: build-cargo-release
    runs-on: spacetimedb-new-runner-2
    env:
      CARGO_TERM_COLOR: always
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    if: ${{ !inputs.dry_run && inputs.release_docker }}

    steps:
      - name: Checkout specific tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}
          submodules: recursive

      - name: Download cargo-release
        uses: actions/download-artifact@v4
        with:
          name: cargo-release-bin
          path: ./shared-bin

      - name: Make binary executable and on PATH
        run: |
          chmod +x ./shared-bin/cargo-release
          echo "$PWD/shared-bin" >> "$GITHUB_PATH"

        # We need network=host during dry-runs but it's fine during non dry-runs as well
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - name: Login to DockerHub
        uses: docker/login-action@v3
        if: ${{ !inputs.dry_run }}
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          # Docker Hub access tokens are passed to docker/login-action via the password input.
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Run Docker release
        run: cargo-release release docker ${{ github.event.inputs.release_tag }}

  update-mirror-latest-version:
    runs-on: ubuntu-latest
    if: ${{ !inputs.dry_run && inputs.update_mirror_latest_version }}

    steps:
      - name: Verify mirror tag prefix exists
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -uo pipefail

          PREFIX="refs/tags/$RELEASE_TAG/"
          COUNT="$(aws s3api list-objects-v2 \
            --bucket spacetimedb-client-binaries \
            --prefix "$PREFIX" \
            --max-keys 1 \
            --query 'length(not_null(Contents, `[]`))')"
          test "$COUNT" -gt 0

      - name: Generate latest-version marker
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: printf '%s\n' "$RELEASE_TAG" > latest-version

      - name: Upload latest-version to S3 mirror
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: aws s3 cp latest-version s3://spacetimedb-client-binaries/latest-version --acl public-read

  publish-github-release:
    needs:
      - build-cargo-release
      - release-crates
      - release-csharp
      - release-cpp
      - release-npm
      - release-docker
      - update-mirror-latest-version
    runs-on: ubuntu-latest
    if: >-
      ${{
        always()
        && !inputs.dry_run
        && inputs.release_github
        && needs.build-cargo-release.result == 'success'
        && contains(fromJSON('["success", "skipped"]'), needs.release-crates.result)
        && contains(fromJSON('["success", "skipped"]'), needs.release-csharp.result)
        && contains(fromJSON('["success", "skipped"]'), needs.release-cpp.result)
        && contains(fromJSON('["success", "skipped"]'), needs.release-npm.result)
        && contains(fromJSON('["success", "skipped"]'), needs.release-docker.result)
        && contains(fromJSON('["success", "skipped"]'), needs.update-mirror-latest-version.result)
      }}
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download cargo-release
        uses: actions/download-artifact@v4
        with:
          name: cargo-release-bin
          path: ./shared-bin

      - name: Make binary executable and on PATH
        run: |
          chmod +x ./shared-bin/cargo-release
          echo "$PWD/shared-bin" >> "$GITHUB_PATH"

      - name: Publish GitHub release
        run: cargo-release release github-release ${{ github.event.inputs.release_tag }}
