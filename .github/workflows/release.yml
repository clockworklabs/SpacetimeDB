name: Release

run-name: ${{ format('Release {0} [{1}]', github.event.inputs.release_tag, github.event.inputs.dry_run == 'true' && 'dry-run' || 'live') }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v1.9.0)"
        required: true
      dry_run:
        description: "Run in dry-run mode"
        required: true
        type: boolean
        default: true
      release_crates:
        description: "Release crates.io packages"
        required: true
        type: boolean
        default: false
      release_csharp:
        description: "Release C# SDK"
        required: true
        type: boolean
        default: false
      release_cpp:
        description: "Release C++ bindings"
        required: true
        type: boolean
        default: false
      release_npm:
        description: "Release NPM package"
        required: true
        type: boolean
        default: false
      release_docker:
        description: "Release Docker container"
        required: true
        type: boolean
        default: false
      release_github:
        description: "Publish GitHub release (if nothing fails)"
        required: true
        type: boolean
        default: false
      update_mirror_latest_version:
        description: "Update S3 mirror latest-version marker"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: manual-release-${{ inputs.release_tag }}${{ inputs.dry_run && format('-dry-run-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  validate-release-invoker:
    name: Validate release invoker
    runs-on: spacetimedb-linux
    steps:
      - name: Reject direct public release invocations
        env:
          EXPECTED_RELEASE_ACTOR: spacetimedb-devops
          ACTUAL_RELEASE_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          if [ "$ACTUAL_RELEASE_ACTOR" != "$EXPECTED_RELEASE_ACTOR" ]; then
            echo "::error::Do not invoke the public release workflow directly. Invoke the private release workflow instead."
            echo "Expected release actor: $EXPECTED_RELEASE_ACTOR"
            echo "Actual release actor: $ACTUAL_RELEASE_ACTOR"
            exit 1
          fi

  # This job runs before all of our release jobs. If there is a release problem we should
  # try to fail during this step to prevent partial releases.
  build-cargo-release:
    needs: validate-release-invoker
    runs-on: spacetimedb-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dsherret/rust-toolchain-file@v1
      - name: Set default rust toolchain
        run: rustup default $(rustup show active-toolchain | cut -d' ' -f1)

      - name: Install cargo-release
        run: |
          cargo install --path tools/release
          # ensure the binary exists
          which cargo-release
          # copy it into a sharable directory
          mkdir -p shared-bin
          cp "$(which cargo-release)" shared-bin/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cargo-release-bin
          path: shared-bin/

  release-crates:
    needs: build-cargo-release
    runs-on: spacetimedb-linux
    if: ${{ inputs.release_crates }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dry_run && github.sha || github.event.inputs.release_tag }}
          submodules: recursive

      - name: Set up Rust
        uses: dsherret/rust-toolchain-file@v1
      - name: Set default rust toolchain
        run: rustup default $(rustup show active-toolchain | cut -d' ' -f1)

      - name: Download cargo-release
        uses: actions/download-artifact@v4
        with:
          name: cargo-release-bin
          path: ./shared-bin

      - name: Make binary executable and on PATH
        run: |
          chmod +x ./shared-bin/cargo-release
          echo "$PWD/shared-bin" >> "$GITHUB_PATH"

      # TODO: dry-run via publishing to a local registry: https://doc.rust-lang.org/cargo/reference/registries.html
      - name: Run release (dry-run)
        if: ${{ inputs.dry_run }}
        # NOTE: This will print a warning that `cargo-release release crates` dry runs are not supported
        run: cargo-release release crates ${{ github.event.inputs.release_tag }} --dry-run

      - name: Run release
        if: ${{ !inputs.dry_run }}
        run: cargo-release release crates ${{ github.event.inputs.release_tag }}

  release-csharp:
    needs: build-cargo-release
    runs-on: spacetimedb-linux
    if: ${{ inputs.release_csharp }}
    env:
      CARGO_TERM_COLOR: always
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dry_run && github.sha || github.event.inputs.release_tag }}
          submodules: recursive

      - name: Set up Rust
        uses: dsherret/rust-toolchain-file@v1
      - name: Set default rust toolchain
        run: rustup default $(rustup show active-toolchain | cut -d' ' -f1)

      - name: Download cargo-release
        uses: actions/download-artifact@v4
        with:
          name: cargo-release-bin
          path: ./shared-bin

      - name: Make binary executable and on PATH
        run: |
          chmod +x ./shared-bin/cargo-release
          echo "$PWD/shared-bin" >> "$GITHUB_PATH"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-path: global.json

      - name: Install NuGet
        shell: bash
        run: |
          sudo apt install -y mono-complete
          mkdir bin
          cd bin
          wget https://dist.nuget.org/win-x86-commandline/latest/nuget.exe
          # We're on linux, so we need to do a mono dance to make NuGet invocations look the same as they would on e.g. windows
          mv nuget.exe nuget-mono.exe
          cat <<'EOF' | sed 's/^ *//' >nuget
            #!/bin/bash
            DIR="$(dirname "$(readlink -f "$0")")"
            mono "$DIR/nuget-mono.exe" "$@"
          EOF
          chmod +x nuget
          echo "$PWD" >> $GITHUB_PATH

      - name: Setup SSH key for Unity SDK repo
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.UNITY_SDK_DEPLOY_KEY }}

      - name: Configure git
        run: |
          git config --global user.name "Release Bot"
          git config --global user.email "no-reply@clockworklabs.io"
          # Remove any HTTPS to SSH conversion set by checkout action
          git config --global --unset-all url.https://github.com/.insteadOf || true
          # Ensure SSH is used instead of HTTPS for GitHub
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          # Verify configuration
          echo "Git URL rewrite config:"
          git config --global --get-regexp url

      - name: Run C# SDK release (dry-run)
        if: ${{ inputs.dry_run }}
        run: cargo-release release csharp ${{ github.event.inputs.release_tag }} --dry-run

      - name: Run C# SDK release
        if: ${{ !inputs.dry_run }}
        run: cargo-release release csharp ${{ github.event.inputs.release_tag }}

  release-cpp:
    needs: build-cargo-release
    runs-on: spacetimedb-linux
    if: ${{ inputs.release_cpp }}
    env:
      CARGO_TERM_COLOR: always
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dry_run && github.sha || github.event.inputs.release_tag }}
          submodules: recursive

      - name: Set up Rust
        uses: dsherret/rust-toolchain-file@v1
      - name: Set default rust toolchain
        run: rustup default $(rustup show active-toolchain | cut -d' ' -f1)

      - name: Download cargo-release
        uses: actions/download-artifact@v4
        with:
          name: cargo-release-bin
          path: ./shared-bin

      - name: Make binary executable and on PATH
        run: |
          chmod +x ./shared-bin/cargo-release
          echo "$PWD/shared-bin" >> "$GITHUB_PATH"

      - name: Setup SSH key for C++ SDK repo
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CPP_SDK_DEPLOY_KEY }}

      - name: Configure git
        run: |
          git config --global user.name "Release Bot"
          git config --global user.email "no-reply@clockworklabs.io"
          # Remove any HTTPS to SSH conversion set by checkout action
          git config --global --unset-all url.https://github.com/.insteadOf || true
          # Ensure SSH is used instead of HTTPS for GitHub
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          # Verify configuration
          echo "Git URL rewrite config:"
          git config --global --get-regexp url

      - name: Run C++ SDK release (dry-run)
        if: ${{ inputs.dry_run }}
        run: cargo-release release cpp ${{ github.event.inputs.release_tag }} --dry-run

      - name: Run C++ SDK release
        if: ${{ !inputs.dry_run }}
        run: cargo-release release cpp ${{ github.event.inputs.release_tag }}

  release-npm:
    needs: build-cargo-release
    # This **MUST** be on a GitHub-provided runner! Otherwise the "trusted publishers" workflow does not work!
    runs-on: ubuntu-latest
    if: ${{ inputs.release_npm }}
    env:
      CARGO_TERM_COLOR: always
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      id-token: write
      contents: write
      packages: write

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dry_run && github.sha || github.event.inputs.release_tag }}
          submodules: recursive

      - name: Download cargo-release
        uses: actions/download-artifact@v4
        with:
          name: cargo-release-bin
          path: ./shared-bin

      - name: Make binary executable and on PATH
        run: |
          chmod +x ./shared-bin/cargo-release
          echo "$PWD/shared-bin" >> "$GITHUB_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      - name: Install npm with trusted publishing support
        run: |
          # this is the minimum version required to use trusted publishing
          npm install --global npm@11.5.1
          npm --version

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Run NPM release (dry-run)
        if: ${{ inputs.dry_run }}
        run: cargo-release release npm ${{ github.event.inputs.release_tag }} --dry-run

      - name: Run NPM release
        if: ${{ !inputs.dry_run }}
        run: cargo-release release npm ${{ github.event.inputs.release_tag }}

  release-docker:
    needs: build-cargo-release
    runs-on: spacetimedb-linux
    env:
      CARGO_TERM_COLOR: always
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    if: ${{ inputs.release_docker }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dry_run && github.sha || github.event.inputs.release_tag }}
          submodules: recursive

      - name: Download cargo-release
        uses: actions/download-artifact@v4
        with:
          name: cargo-release-bin
          path: ./shared-bin

      - name: Make binary executable and on PATH
        run: |
          chmod +x ./shared-bin/cargo-release
          echo "$PWD/shared-bin" >> "$GITHUB_PATH"

        # We need network=host during dry-runs but it's fine during non dry-runs as well
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - name: Login to DockerHub
        uses: docker/login-action@v3
        if: ${{ !inputs.dry_run }}
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          # Docker Hub access tokens are passed to docker/login-action via the password input.
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Run Docker release
        run: cargo-release release docker ${{ github.event.inputs.release_tag }} ${{ inputs.dry_run && '--dry-run' || '' }}

  update-mirror-latest-version:
    needs: validate-release-invoker
    # This could move to a custom runner, but it would need to have the AWS cli installed
    runs-on: ubuntu-latest
    if: ${{ !inputs.dry_run && inputs.update_mirror_latest_version }}

    steps:
      - name: Verify mirror tag prefix exists
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -uo pipefail

          PREFIX="refs/tags/$RELEASE_TAG/"
          COUNT="$(aws s3api list-objects-v2 \
            --bucket spacetimedb-client-binaries \
            --prefix "$PREFIX" \
            --max-keys 1 \
            --query 'length(not_null(Contents, `[]`))')"
          test "$COUNT" -gt 0

      - name: Generate latest-version marker
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: printf '%s\n' "$RELEASE_TAG" > latest-version

      - name: Upload latest-version to S3 mirror
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: aws s3 cp latest-version s3://spacetimedb-client-binaries/latest-version --acl public-read

  publish-github-release:
    needs:
      - build-cargo-release
      - release-crates
      - release-csharp
      - release-cpp
      - release-npm
      - release-docker
      - update-mirror-latest-version
    runs-on: spacetimedb-linux
    if: >-
      ${{
        always()
        && !inputs.dry_run
        && inputs.release_github
        && needs.build-cargo-release.result == 'success'
        && contains(fromJSON('["success", "skipped"]'), needs.release-crates.result)
        && contains(fromJSON('["success", "skipped"]'), needs.release-csharp.result)
        && contains(fromJSON('["success", "skipped"]'), needs.release-cpp.result)
        && contains(fromJSON('["success", "skipped"]'), needs.release-npm.result)
        && contains(fromJSON('["success", "skipped"]'), needs.release-docker.result)
        && contains(fromJSON('["success", "skipped"]'), needs.update-mirror-latest-version.result)
      }}
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download cargo-release
        uses: actions/download-artifact@v4
        with:
          name: cargo-release-bin
          path: ./shared-bin

      - name: Make binary executable and on PATH
        run: |
          chmod +x ./shared-bin/cargo-release
          echo "$PWD/shared-bin" >> "$GITHUB_PATH"

      - name: Publish GitHub release
        run: cargo-release release github-release ${{ github.event.inputs.release_tag }}

      - name: Trigger release notifications
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail

          release_json="$(gh release view "$RELEASE_TAG" --repo clockworklabs/SpacetimeDB --json body,url)"
          body="$(jq -r '.body' <<< "$release_json")"
          url="$(jq -r '.url' <<< "$release_json")"

          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg url "$url" \
            --arg body "$body" \
            '{release_tag: $tag, release_url: $url, release_body: $body, dry_run: "false"}' \
          | gh workflow run tag-release.yml --repo clockworklabs/SpacetimeDB --ref master --json

  notify-release-status:
    needs:
      - validate-release-invoker
      - build-cargo-release
      - release-crates
      - release-csharp
      - release-cpp
      - release-npm
      - release-docker
      - update-mirror-latest-version
      - publish-github-release
    runs-on: spacetimedb-linux
    if: ${{ always() }}
    steps:
      - name: Send Discord release status
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_RELEASE_ANNOUNCE_URL }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          VALIDATE_RELEASE_INVOKER: ${{ needs.validate-release-invoker.result }}
          BUILD_CARGO_RELEASE: ${{ needs.build-cargo-release.result }}
          RELEASE_CRATES: ${{ needs.release-crates.result }}
          RELEASE_CSHARP: ${{ needs.release-csharp.result }}
          RELEASE_CPP: ${{ needs.release-cpp.result }}
          RELEASE_NPM: ${{ needs.release-npm.result }}
          RELEASE_DOCKER: ${{ needs.release-docker.result }}
          UPDATE_MIRROR_LATEST_VERSION: ${{ needs.update-mirror-latest-version.result }}
          PUBLISH_GITHUB_RELEASE: ${{ needs.publish-github-release.result }}
        run: |
          set -euo pipefail

          status_emoji() {
            case "$1" in
              success) printf '✅' ;;
              failure) printf '❌' ;;
              cancelled) printf '⏹️' ;;
              skipped) printf '⏭️' ;;
              *) printf '❓' ;;
            esac
          }

          add_status() {
            local label="$1"
            local result="$2"
            message+=$'\n'
            message+="$(status_emoji "$result") ${label}"
          }

          mode="live"
          if [ "$DRY_RUN" = "true" ]; then
            mode="dry-run"
          fi

          message="Release ${RELEASE_TAG} [${mode}]"
          message+=$'\n'
          message+="Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          add_status "Validate release invoker" "$VALIDATE_RELEASE_INVOKER"
          add_status "Build cargo-release" "$BUILD_CARGO_RELEASE"
          add_status "Crates" "$RELEASE_CRATES"
          add_status "C#" "$RELEASE_CSHARP"
          add_status "C++" "$RELEASE_CPP"
          add_status "NPM" "$RELEASE_NPM"
          add_status "Docker" "$RELEASE_DOCKER"
          add_status "S3 mirror latest-version" "$UPDATE_MIRROR_LATEST_VERSION"
          add_status "GitHub release" "$PUBLISH_GITHUB_RELEASE"

          data="$(jq --null-input --arg msg "$message" '.content=$msg')"
          curl --fail-with-body -X POST -H 'Content-Type: application/json' -d "$data" "$DISCORD_WEBHOOK_URL"
