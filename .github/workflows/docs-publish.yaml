name: Docs / Publish

permissions:
  contents: read

on:
  push:
    branches:
      - docs/release

jobs:
  build:
    # Docusaurus exceeds the small runner's roughly 2 GiB default Node heap.
    runs-on: spacetimedb-linux
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
      
      - uses: ./.github/actions/setup-pnpm
        with:
          run_install: true

      - name: Install dependencies
        working-directory: docs
        run: pnpm install

      - name: Docusaurus build
        working-directory: docs
        run: pnpm build

      - name: Publish docs to S3
        uses: shallwefootball/s3-upload-action@0d261a6f15b3b2e209dfebdecace4b100c04f95b # master
        with:
          aws_key_id: ${{ secrets.DOCS_AWS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.DOCS_AWS_SECRET_ACCESS_KEY}}
          aws_bucket: spacetimedb-docs
          source_dir: docs/build
          destination_dir: 'docs'

  notify-discord:
    name: Notify Discord
    needs: build
    if: ${{ always() }}
    runs-on: spacetimedb-linux-small
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_PUBLIC_ANNOUNCEMENTS_WEBHOOK_URL }}
          RELEASE_OPS_ROLE_ID: ${{ secrets.DEV_OPS_ROLE_ID }}
          RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail

          STATUS="${RESULT^^}"
          CONTENT="Docs release workflow ${STATUS}"

          case "$RESULT" in
            success)
              COLOR=3066993 # green
              ;;
            failure)
              COLOR=15158332 # red
              CONTENT="<@&${RELEASE_OPS_ROLE_ID}> ${CONTENT}"
              ;;
            *)
              COLOR=9807270 # gray
              ;;
          esac

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(
            jq -n \
              --arg content "$CONTENT" \
              --arg status "$STATUS" \
              --arg color "$COLOR" \
              --arg run_url "$RUN_URL" \
              --arg commit "${{ github.sha }}" \
              '{
                "content": $content,
                "embeds": [
                  {
                    "title": "Docs Release: \($status)",
                    "url": $run_url,
                    "color": ($color | tonumber),
                    "fields": [
                      { "name": "Result", "value": $status, "inline": true },
                      { "name": "Commit", "value": "`\($commit)`", "inline": true }
                    ]
                  }
                ]
              }'
          )

          curl --fail-with-body \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"
