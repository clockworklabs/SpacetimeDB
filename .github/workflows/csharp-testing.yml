name: C# Testing Packages

on:
  workflow_call:
    inputs:
      source-ref:
        type: string
        required: true
      release-tag:
        type: string
        default: ""
    outputs:
      package-version:
        value: ${{ jobs.prepare.outputs.package-version }}
      source-sha:
        value: ${{ jobs.prepare.outputs.sha }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      package-version: ${{ steps.source.outputs.package-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref }}
      - id: source
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -n "$RELEASE_TAG" ]; then
            version="${RELEASE_TAG#v}"
            # Hotfix tags reuse the existing NuGet version, as in cargo-release.
            version="${version%%-hotfix*}"
          else
            version="0.0.0-packagetest.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          fi
          echo "package-version=$version" >> "$GITHUB_OUTPUT"

  csharp_testing_native:
    needs: prepare
    name: C# testing native bridge (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: &csharp-testing-platforms
        include:
          # Match the CLI's glibc baseline. Do not upgrade these images implicitly.
          - { rid: linux-x64, target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04, library: libspacetimedb_test_datastore_ffi.so }
          - { rid: linux-arm64, target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm, library: libspacetimedb_test_datastore_ffi.so }
          - { rid: win-x64, target: x86_64-pc-windows-msvc, runner: windows-2022, library: spacetimedb_test_datastore_ffi.dll }
    defaults:
      run:
        shell: bash
    env:
      RUST_BACKTRACE: full
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dsherret/rust-toolchain-file@v1
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build native bridge
        run: |
          # A cross-compiled binary alone is not platform coverage.
          rustc -vV | grep -Fx 'host: ${{ matrix.target }}'
          cargo build --locked --release --target ${{ matrix.target }} -p spacetimedb-test-datastore-ffi
          mkdir -p native/${{ matrix.rid }}
          cp "$CARGO_TARGET_DIR/${{ matrix.target }}/release/${{ matrix.library }}" native/${{ matrix.rid }}/

      - name: Inspect Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          library="native/${{ matrix.rid }}/${{ matrix.library }}"
          readelf -h "$library"
          readelf -d "$library"
          ldd "$library" | tee native-dependencies.txt
          if grep -q 'not found' native-dependencies.txt; then
            exit 1
          fi
          # Reject accidental linkage against a newer glibc than Ubuntu 22.04's.
          required="$(readelf --version-info "$library" | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)"
          test "$(printf '%s\n' GLIBC_2.35 "$required" | sort -V | tail -1)" = GLIBC_2.35

      - name: Inspect Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$installation\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found' }
          & $dumpbin.FullName /headers /dependents "native/${{ matrix.rid }}/${{ matrix.library }}"
          if ($LASTEXITCODE -ne 0) { throw 'Native dependency inspection failed' }

      - name: Run managed tests against Release bridge
        run: |
          dotnet test crates/bindings-csharp/Testing.Tests/Testing.Tests.csproj -c Release -warnaserror \
            -p:NativeTestLibrary="$GITHUB_WORKSPACE/native/${{ matrix.rid }}/${{ matrix.library }}"

      - name: Upload tested native bridge
        uses: actions/upload-artifact@v4
        with:
          name: spacetimedb-testing-native-${{ matrix.rid }}
          path: native/
          if-no-files-found: error
          retention-days: 14

  csharp_testing_pack:
    needs: [prepare, csharp_testing_native]
    name: Assemble C# testing packages
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PACKAGE_VERSION: ${{ needs.prepare.outputs.package-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          pattern: spacetimedb-testing-native-*
          merge-multiple: true
          path: native

      - name: Pack complete package set
        shell: bash
        run: |
          dotnet pack crates/bindings-csharp/BSATN.Runtime -c Release -p:Version="$PACKAGE_VERSION" -o feed
          dotnet pack crates/bindings-csharp/Runtime -c Release -p:Version="$PACKAGE_VERSION" -o feed
          dotnet pack crates/bindings-csharp/Testing -c Release -p:Version="$PACKAGE_VERSION" -o feed \
            -p:TestingNativeArtifactsDir="$GITHUB_WORKSPACE/native"
          # Check that packing preserved every tested binary at its NuGet runtime path.
          for library in native/*/*; do
            rid="$(basename "$(dirname "$library")")"
            unzip -p "feed/SpacetimeDB.Testing.$PACKAGE_VERSION.nupkg" "runtimes/$rid/native/$(basename "$library")" | cmp "$library" -
          done

      - name: Reject a mismatched Runtime dependency
        shell: bash
        run: |
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          # A newer Runtime would be accepted if Testing accidentally used a minimum version.
          mismatch="$PACKAGE_VERSION.1"
          dotnet pack crates/bindings-csharp/BSATN.Runtime -c Release -p:Version="$mismatch" -o "$work/feed"
          dotnet pack crates/bindings-csharp/Runtime -c Release -p:Version="$mismatch" -o "$work/feed"
          cp feed/*.nupkg "$work/feed/"
          cp global.json "$work/"
          echo '<Project />' > "$work/Directory.Build.props"
          echo '<Project />' > "$work/Directory.Build.targets"
          cat > "$work/Mismatch.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="SpacetimeDB.Testing" Version="[$PACKAGE_VERSION]" />
              <PackageReference Include="SpacetimeDB.Runtime" Version="[$mismatch]" />
            </ItemGroup>
          </Project>
          EOF
          cd "$work"
          export NUGET_PACKAGES="$work/packages"
          if dotnet restore Mismatch.csproj --source "$work/feed" -p:NuGetAudit=false -warnaserror:NU1608 > restore.log 2>&1; then
            cat restore.log
            echo 'Testing unexpectedly accepted a mismatched Runtime version.'
            exit 1
          fi
          cat restore.log
          grep -q 'error NU1608' restore.log

      - uses: actions/upload-artifact@v4
        with:
          name: spacetimedb-testing-packages
          path: feed/*.nupkg
          if-no-files-found: error
          retention-days: 14

  csharp_testing_packages:
    needs: [prepare, csharp_testing_pack]
    env:
      PACKAGE_VERSION: ${{ needs.prepare.outputs.package-version }}
    name: C# testing package acceptance (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: *csharp-testing-platforms
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: spacetimedb-testing-packages
          path: feed

      - name: Check C# testing NuGet packages
        shell: bash
        run: |
          work="$(mktemp -d)"
          # NuGet needs a Windows path, not Git Bash's /tmp path.
          if [ "$RUNNER_OS" = Windows ]; then work="$(cygpath -m "$work")"; fi
          trap 'rm -rf "$work"' EXIT
          feed="$(pwd)/feed"
          if [ "$RUNNER_OS" = Windows ]; then feed="$(cygpath -m "$feed")"; fi
          version="$PACKAGE_VERSION"
          mkdir -p "$work/Module" "$work/Tests"
          cp crates/bindings-csharp/Testing.PackageTests/Module/* "$work/Module/"
          cp crates/bindings-csharp/Testing.PackageTests/Tests/* "$work/Tests/"
          cp global.json "$work/"
          cat > "$work/Directory.Build.props" <<EOF
          <Project>
            <PropertyGroup>
              <SpacetimeDBPackageVersion>$version</SpacetimeDBPackageVersion>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
          </Project>
          EOF
          echo '<Project />' > "$work/Directory.Build.targets"
          cat > "$work/NuGet.Config" <<EOF
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$feed" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <clear />
              <packageSource key="local"><package pattern="SpacetimeDB.*" /></packageSource>
              <packageSource key="nuget.org"><package pattern="*" /></packageSource>
            </packageSourceMapping>
          </configuration>
          EOF
          cd "$work"
          export NUGET_PACKAGES="$work/packages"
          export NUGET_HTTP_CACHE_PATH="$work/http-cache"
          dotnet restore Tests/Tests.csproj --configfile NuGet.Config
          dotnet test Tests/Tests.csproj --no-restore -c Release -warnaserror
          test -f "Tests/bin/Release/net10.0/runtimes/${{ matrix.rid }}/native/${{ matrix.library }}"
