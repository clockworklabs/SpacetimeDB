name: C# Testing Packages

on:
  workflow_call:
    inputs:
      use-release-tag:
        type: boolean
        default: false
      release-tag:
        type: string
        default: ""
      # Pull requests build and test linux-x64 only. Everything that lands or ships covers all platforms.
      all-platforms:
        type: boolean
        default: true
    outputs:
      package-version:
        value: ${{ jobs.prepare.outputs.package-version }}
      source-sha:
        value: ${{ jobs.prepare.outputs.sha }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      package-version: ${{ steps.source.outputs.package-version }}
      platforms: ${{ steps.platforms.outputs.platforms }}
      rids: ${{ steps.platforms.outputs.rids }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.use-release-tag && '0' || '1' }}
      - id: source
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          USE_RELEASE_TAG: ${{ inputs.use-release-tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          if [ "$USE_RELEASE_TAG" = true ]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release tag: $RELEASE_TAG" >&2
              exit 1
            fi
            git check-ref-format "refs/tags/$RELEASE_TAG"
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
            sha=$(git rev-parse --verify 'FETCH_HEAD^{commit}')

            # A tag name alone is not a trust boundary. Require protected branch history.
            trusted_heads=$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?protected=true&per_page=100" \
              --jq '.[] | select(.name == "master" or (.name | startswith("release/"))) | .commit.sha')
            trusted=false
            while IFS= read -r head; do
              [ -n "$head" ] || continue
              git fetch --no-tags origin "$head"
              if git merge-base --is-ancestor "$sha" "$head"; then
                trusted=true
                break
              fi
            done <<< "$trusted_heads"
            if [ "$trusted" != true ]; then
              echo "Release tag must belong to protected master or release/* history" >&2
              exit 1
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ -n "$RELEASE_TAG" ]; then
            version="${RELEASE_TAG#v}"
            # Hotfix tags reuse the existing NuGet version, as in cargo-release.
            version="${version%%-hotfix*}"
          else
            version="0.0.0-packagetest.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          fi
          echo "package-version=$version" >> "$GITHUB_OUTPUT"
      - id: platforms
        shell: bash
        env:
          ALL_PLATFORMS: ${{ inputs.all-platforms }}
        run: |
          # Match the CLI's glibc baseline. Do not upgrade these images implicitly.
          linux_x64='{"rid":"linux-x64","target":"x86_64-unknown-linux-gnu","runner":"ubuntu-22.04","library":"libspacetimedb_test_datastore_ffi.so"}'
          linux_arm64='{"rid":"linux-arm64","target":"aarch64-unknown-linux-gnu","runner":"ubuntu-22.04-arm","library":"libspacetimedb_test_datastore_ffi.so"}'
          win_x64='{"rid":"win-x64","target":"x86_64-pc-windows-msvc","runner":"windows-2022","library":"spacetimedb_test_datastore_ffi.dll"}'
          if [ "$ALL_PLATFORMS" = true ]; then
            echo "platforms={\"include\":[$linux_x64,$linux_arm64,$win_x64]}" >> "$GITHUB_OUTPUT"
            echo "rids=linux-x64;linux-arm64;win-x64" >> "$GITHUB_OUTPUT"
          else
            echo "platforms={\"include\":[$linux_x64]}" >> "$GITHUB_OUTPUT"
            echo "rids=linux-x64" >> "$GITHUB_OUTPUT"
          fi

  csharp_testing_native:
    needs: prepare
    name: C# testing native bridge (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    defaults:
      run:
        shell: bash
    env:
      RUST_BACKTRACE: full
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: dsherret/rust-toolchain-file@v1
      - uses: Swatinem/rust-cache@v2
        with:
          key: csharp-testing-${{ matrix.target }}
          # Only master populates the cache, so pull requests don't evict each other's entries.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build native bridge
        run: |
          # A cross-compiled binary alone is not platform coverage.
          rustc -vV | grep -Fx 'host: ${{ matrix.target }}'
          cargo build --locked --release --target ${{ matrix.target }} -p spacetimedb-test-datastore-ffi
          mkdir -p native/${{ matrix.rid }}
          cp "$CARGO_TARGET_DIR/${{ matrix.target }}/release/${{ matrix.library }}" native/${{ matrix.rid }}/

      - name: Inspect Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          library="native/${{ matrix.rid }}/${{ matrix.library }}"
          readelf -h "$library"
          readelf -d "$library"
          ldd "$library" | tee native-dependencies.txt
          if grep -q 'not found' native-dependencies.txt; then
            exit 1
          fi
          # Reject accidental linkage against a newer glibc than Ubuntu 22.04's.
          required="$(readelf --version-info "$library" | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)"
          test "$(printf '%s\n' GLIBC_2.35 "$required" | sort -V | tail -1)" = GLIBC_2.35

      - name: Run managed tests against Release bridge
        run: |
          dotnet test crates/bindings-csharp/Testing.Tests/Testing.Tests.csproj -c Release -warnaserror \
            -p:NativeTestLibrary="$GITHUB_WORKSPACE/native/${{ matrix.rid }}/${{ matrix.library }}"

      - name: Upload tested native bridge
        uses: actions/upload-artifact@v4
        with:
          name: spacetimedb-testing-native-${{ matrix.rid }}
          path: native/
          if-no-files-found: error
          retention-days: 14

  csharp_testing_pack:
    needs: [prepare, csharp_testing_native]
    name: Assemble C# testing packages
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PACKAGE_VERSION: ${{ needs.prepare.outputs.package-version }}
      RIDS: ${{ needs.prepare.outputs.rids }}
      ALL_PLATFORMS: ${{ inputs.all-platforms }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          pattern: spacetimedb-testing-native-*
          merge-multiple: true
          path: native

      - name: Pack complete package set
        shell: bash
        run: |
          dotnet pack crates/bindings-csharp/BSATN.Runtime -c Release -p:Version="$PACKAGE_VERSION" -o feed
          dotnet pack crates/bindings-csharp/Runtime -c Release -p:Version="$PACKAGE_VERSION" -o feed
          partial=()
          if [ "$ALL_PLATFORMS" != true ]; then
            # Pull-request packages are prerelease builds for the platforms tested above.
            partial=(-p:TestingLocalPackage=true "-p:TestingNativeRids=$RIDS")
          fi
          dotnet pack crates/bindings-csharp/Testing -c Release -p:Version="$PACKAGE_VERSION" -o feed \
            -p:TestingNativeArtifactsDir="$GITHUB_WORKSPACE/native" "${partial[@]}"
          # Check that packing preserved every tested binary at its NuGet runtime path.
          for library in native/*/*; do
            rid="$(basename "$(dirname "$library")")"
            unzip -p "feed/SpacetimeDB.Testing.$PACKAGE_VERSION.nupkg" "runtimes/$rid/native/$(basename "$library")" | cmp "$library" -
          done

      - name: Check Testing pins its exact Runtime version
        shell: bash
        run: |
          # A minimum-version dependency would let a different Runtime satisfy Testing.
          unzip -p "feed/SpacetimeDB.Testing.$PACKAGE_VERSION.nupkg" SpacetimeDB.Testing.nuspec | tee nuspec.xml
          grep -F "id=\"SpacetimeDB.Runtime\" version=\"[$PACKAGE_VERSION]\"" nuspec.xml

      - uses: actions/upload-artifact@v4
        with:
          name: spacetimedb-testing-packages
          path: feed/*.nupkg
          if-no-files-found: error
          retention-days: 14

  csharp_testing_packages:
    needs: [prepare, csharp_testing_pack]
    env:
      PACKAGE_VERSION: ${{ needs.prepare.outputs.package-version }}
    name: C# testing package acceptance (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: spacetimedb-testing-packages
          path: feed

      - name: Check C# testing NuGet packages
        shell: bash
        run: |
          work="$(mktemp -d)"
          # NuGet needs a Windows path, not Git Bash's /tmp path.
          if [ "$RUNNER_OS" = Windows ]; then work="$(cygpath -m "$work")"; fi
          trap 'rm -rf "$work"' EXIT
          feed="$(pwd)/feed"
          if [ "$RUNNER_OS" = Windows ]; then feed="$(cygpath -m "$feed")"; fi
          version="$PACKAGE_VERSION"
          mkdir -p "$work/spacetimedb" "$work/tests"
          cp templates/chat-console-cs/spacetimedb/{Lib.cs,StdbModule.csproj} "$work/spacetimedb/"
          cp templates/chat-console-cs/tests/* "$work/tests/"
          cp global.json "$work/"
          cat > "$work/Directory.Build.props" <<EOF
          <Project>
            <PropertyGroup>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
          </Project>
          EOF
          cat > "$work/Directory.Build.targets" <<EOF
          <Project>
            <ItemGroup>
              <PackageReference Update="SpacetimeDB.Runtime;SpacetimeDB.Testing" Version="[$version]" />
            </ItemGroup>
          </Project>
          EOF
          cat > "$work/NuGet.Config" <<EOF
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$feed" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <clear />
              <packageSource key="local"><package pattern="SpacetimeDB.*" /></packageSource>
              <packageSource key="nuget.org"><package pattern="*" /></packageSource>
            </packageSourceMapping>
          </configuration>
          EOF
          cd "$work"
          export NUGET_PACKAGES="$work/packages"
          export NUGET_HTTP_CACHE_PATH="$work/http-cache"
          # Match the .NET 10 project emitted by spacetime init.
          sed -i 's/<TargetFrameworks>net8.0;net10.0<\/TargetFrameworks>/<TargetFramework>net10.0<\/TargetFramework>/' spacetimedb/StdbModule.csproj
          dotnet restore tests/Module.Tests.csproj --configfile NuGet.Config
          dotnet test tests/Module.Tests.csproj --no-restore -c Release -warnaserror
          test -f "tests/bin/Release/net10.0/runtimes/${{ matrix.rid }}/native/${{ matrix.library }}"
