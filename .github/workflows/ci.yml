      # This step shouldn't be needed, but somehow we end up with caches that are missing librusty_v8.a.
      # ChatGPT suspects that this could be due to different build invocations using the same target dir,
      # and this makes sense to me because we only see it in this job where we mix `cargo build -p` with
      # `cargo build --manifest-path` (which apparently build different dependency trees).
      # However, we've been unable to fix it so... /shrug
      - name: Check v8 outputs
        run: |
          find "${CARGO_TARGET_DIR}"/ -type f | grep '[/_]v8' || true
          if ! [ -f "${CARGO_TARGET_DIR}"/debug/gn_out/obj/librusty_v8.a ]; then
            echo "Could not find v8 output file librusty_v8.a; rebuilding manually."
            cargo clean -p v8 || true
            cargo build -p v8
          fi
          find "${CARGO_TARGET_DIR}"/ -type f | grep '[/_]v8' || true
          if ! [ -f "${CARGO_TARGET_DIR}"/release/gn_out/obj/librusty_v8.a ]; then
            echo "Could not find v8 output file librusty_v8.a; rebuilding manually."
            cargo clean --release -p v8 || true
            cargo build --release -p v8
          fi

      - name: Install SpacetimeDB CLI from the local checkout
        run: |
          export CARGO_HOME="$HOME/.cargo"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          cargo install --force --path crates/cli --locked --message-format=short
          cargo install --force --path crates/standalone --features allow_loopback_http_for_tests --locked --message-format=short
          # Add a handy alias using the old binary name, so that we don't have to rewrite all scripts (incl. in submodules).
          ln -sf $CARGO_HOME/bin/spacetimedb-cli $CARGO_HOME/bin/spacetime

      - name: Check quickstart-chat bindings are up to date
        run: |
          for dotnet_version in 8 10; do
            bash sdks/csharp/tools~/gen-quickstart.sh "$dotnet_version"
          done
          tools/check-diff.sh templates/chat-console-cs/module_bindings || {
              echo 'Error: quickstart-chat bindings have changed. Please run `sdks/csharp/tools~/gen-quickstart.sh 10`.'
              exit 1
          }

      # TODO: Re-enable this once csharp is using the v2 ws api.
      # - name: Check client-api bindings are up to date
      #   working-directory: sdks/csharp
      #   run: |
      #     bash tools~/gen-client-api.sh
      #     "${GITHUB_WORKSPACE}"/tools/check-diff.sh src/SpacetimeDB/ClientApi || {
      #         echo 'Error: Client API bindings are dirty. Please run `sdks/csharp/tools~/gen-client-api.sh`.'
      #         exit 1
      #     }

      - name: Start SpacetimeDB
        run: |
          spacetime start &
          disown

      - name: Run regression tests
        run: |
          bash sdks/csharp/tools~/run-regression-tests.sh
          # Restore global.json symlinks (we replaced them with files to work around .NET 10 SDK bug)
          # server is 5 levels deep from root, republishing dirs are 6 levels deep
          if [ -f sdks/csharp/examples~/regression-tests/server/global.json ] && [ ! -L sdks/csharp/examples~/regression-tests/server/global.json ]; then
            echo "Restoring symlink at server/global.json"
            rm -f sdks/csharp/examples~/regression-tests/server/global.json
            ln -s ../../../../../global.json sdks/csharp/examples~/regression-tests/server/global.json
          fi
          for dir in sdks/csharp/examples~/regression-tests/republishing/server-initial \
                     sdks/csharp/examples~/regression-tests/republishing/server-republish; do
            if [ -f "$dir/global.json" ] && [ ! -L "$dir/global.json" ]; then
              echo "Restoring symlink at $dir/global.json"
              rm -f "$dir/global.json"
              ln -s ../../../../../../global.json "$dir/global.json"
            fi
          done
          tools/check-diff.sh sdks/csharp/examples~/regression-tests || {
              echo 'Error: Bindings are dirty. Please run `sdks/csharp/tools~/gen-regression-tests.sh`.'
              exit 1
          }

  global_json_policy:
    needs: [merge_queue_noop]
    if: ${{ needs.merge_queue_noop.outputs.skip != 'true' }}
    name: Verify global.json files are symlinks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUST_BACKTRACE: full
    steps:
      - name: Find Git ref
        env:
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            GIT_REF="refs/pull/$PR_NUMBER/merge"
          else
            GIT_REF="${{ github.ref }}"
          fi
          echo "GIT_REF=${GIT_REF}" >>"$GITHUB_ENV"

      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GIT_REF }}

      - uses: dsherret/rust-toolchain-file@v1
      - name: Set default rust toolchain
        run: rustup default $(rustup show active-toolchain | cut -d' ' -f1)

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ github.workspace }}
          shared-key: spacetimedb
          save-if: false
          prefix-key: v1

      - name: Check global.json policy
        run: cargo ci global-json-policy

  smoketests_mod_rs_complete:
    needs: [merge_queue_noop]
    if: ${{ needs.merge_queue_noop.outputs.skip != 'true' }}
    name: Check smoketests/mod.rs is complete
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUST_BACKTRACE: full
    steps:
      - name: Find Git ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          PR_NUMBER="${{ github.event.inputs.pr_number || null }}"
          if test -n "${PR_NUMBER}"; then
            GIT_REF="$( gh pr view --repo clockworklabs/SpacetimeDB $PR_NUMBER --json headRefName --jq .headRefName )"
          else
            GIT_REF="${{ github.ref }}"
          fi
          echo "GIT_REF=${GIT_REF}" >>"$GITHUB_ENV"
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GIT_REF }}
      - uses: dsherret/rust-toolchain-file@v1
      - name: Set default rust toolchain
        run: rustup default $(rustup show active-toolchain | cut -d' ' -f1)
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ github.workspace }}
          shared-key: spacetimedb
          cache-on-failure: false
          cache-all-crates: true
          cache-workspace-crates: true
          prefix-key: v1

      # This step shouldn't be needed, but somehow we end up with caches that are missing librusty_v8.a.
      # ChatGPT suspects that this could be due to different build invocations using the same target dir,
      # and this makes sense to me because we only see it in this job where we mix `cargo build -p` with
      # `cargo build --manifest-path` (which apparently build different dependency trees).
      # However, we've been unable to fix it so... /shrug
      - name: Check v8 outputs
        shell: bash
        run: |
          find "${CARGO_TARGET_DIR}"/ -type f | grep '[/_]v8' || true
          if ! [ -f "${CARGO_TARGET_DIR}"/debug/gn_out/obj/librusty_v8.a ]; then
            echo "Could not find v8 output file librusty_v8.a; rebuilding manually."
            cargo clean -p v8 || true
            cargo build -p v8
          fi

      - name: Verify crates/smoketests/tests/smoketests/mod.rs lists all entries
        run: |
          cargo ci smoketests check-mod-list

  docs-build:
    needs: [merge_queue_noop]
    if: ${{ needs.merge_queue_noop.outputs.skip != 'true' }}
    name: Docs build
    runs-on: spacetimedb-new-runner-2
    env:
      RUST_BACKTRACE: full
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - uses: ./.github/actions/setup-pnpm
        with:
          run_install: true

      - name: Get pnpm store directory
        working-directory: sdks/typescript
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - uses: dsherret/rust-toolchain-file@v1
      - name: Set default rust toolchain
        run: rustup default $(rustup show active-toolchain | cut -d' ' -f1)

      - name: Docusaurus build
        run: cargo ci docs

