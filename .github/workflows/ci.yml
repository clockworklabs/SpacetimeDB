on:
  pull_request:
  push:
    branches:
      - master
  merge_group:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request Number"
        required: false
        default: ""

name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.inputs.pr_number || format('sha-{0}', github.sha) }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  upload-build-artifacts-linux:
    name: Upload build artifacts (Linux)
    runs-on: spacetimedb-new-runner-2-staging
    timeout-minutes: 15
    env:
      RUST_BACKTRACE: full
      ARTIFACT_SUFFIX: linux
      EXE_SUFFIX: ""
    steps: &upload-build-artifact-steps
      - &set-cargo-target-dir
        name: Set Cargo target directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=${HOME}/actions-runner/target" >>"${GITHUB_ENV}"

      - &find-git-ref
        name: Find Git ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          PR_NUMBER="${{ github.event.inputs.pr_number || null }}"
          if test -n "${PR_NUMBER}"; then
            GIT_REF="$( gh pr view --repo clockworklabs/SpacetimeDB $PR_NUMBER --json headRefName --jq .headRefName )"
          else
            GIT_REF="${{ github.ref }}"
          fi
          echo "GIT_REF=${GIT_REF}" >>"$GITHUB_ENV"

      - &checkout-sources
        name: Checkout sources
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GIT_REF }}

      - uses: dsherret/rust-toolchain-file@v1
      - &set-default-rust-toolchain
        name: Set default rust toolchain
        run: rustup default $(rustup show active-toolchain | cut -d' ' -f1)

      - name: print dir
        run: pwd -P
      - name: find files
        run: find ~ -maxdepth 3
      - name: look for openssl stuff
        run: find ${CARGO_TARGET_DIR}/release/build/openssl-* -type f

      - name: Build CLI and standalone
        shell: bash
        run: |
          cargo build --timings --release \
            -p spacetimedb-cli \
            -p spacetimedb-standalone \
            --features spacetimedb-standalone/allow_loopback_http_for_tests

      - name: Package build artifacts
        shell: bash
        run: |
          tar -czf build-support.tar.gz \
            "${CARGO_TARGET_DIR}/release/spacetimedb-cli${EXE_SUFFIX}" \
            "${CARGO_TARGET_DIR}/release/spacetimedb-standalone${EXE_SUFFIX}"

      - name: Upload Cargo timing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-cargo-timings-${{ env.ARTIFACT_SUFFIX }}
          path: ${{ env.CARGO_TARGET_DIR }}/cargo-timings/
          if-no-files-found: warn
          overwrite: true
          retention-days: 14

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ env.ARTIFACT_SUFFIX }}
          path: build-support.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  smoketest_build_linux:
    needs: [upload-build-artifacts-linux]
    name: Build smoketests (Linux)
    runs-on: spacetimedb-new-runner-2
    timeout-minutes: 15
    env:
      RUST_BACKTRACE: full
      ARTIFACT_SUFFIX: linux
      EXE_SUFFIX: ""
      SMOKETEST_SUITE: standalone
    steps: &smoketest-build-steps
      - *set-cargo-target-dir

      - *find-git-ref

      - *checkout-sources

      - uses: dsherret/rust-toolchain-file@v1
      - *set-default-rust-toolchain

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Build smoketest dependencies and archive test binaries
        shell: bash
        run: |
          cargo run --timings --package ci -- smoketests --suite "${SMOKETEST_SUITE}" archive --archive-file smoketest-nextest.tar.zst

          shopt -s nullglob
          precompiled_modules=(${CARGET_TARGET_DIR}/wasm32-unknown-unknown/release/smoketest_module_*.wasm)
          if (( ${#precompiled_modules[@]} == 0 )); then
            echo "No precompiled smoketest modules were produced."
            exit 1
          fi

          tar -czf smoketest-support.tar.gz \
            "${CARGO_TARGET_DIR}/debug/ci-smoketests${EXE_SUFFIX}" \
            "${precompiled_modules[@]}"

      - name: Upload smoketest build
        uses: actions/upload-artifact@v4
        with:
          name: smoketest-build-${{ env.ARTIFACT_SUFFIX }}
          path: |
            smoketest-nextest.tar.zst
            smoketest-support.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 14
