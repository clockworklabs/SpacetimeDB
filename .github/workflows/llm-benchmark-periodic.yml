name: Periodic LLM benchmarks

on:
  schedule:
    # Weekly on Monday at midnight UTC.
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      model_set:
        description: 'Model set to run'
        required: false
        type: choice
        options:
          - website_active
          - local_defaults
          - explicit
        default: website_active
      models:
        description: 'Space-separated provider:model groups. Required when model_set=explicit.'
        required: false
        default: ''
      languages:
        description: 'Languages to benchmark (comma-separated: rust,csharp,typescript)'
        required: false
        default: 'rust,csharp,typescript'
      modes:
        description: 'Modes to run (comma-separated: guidelines,no_context,docs,...)'
        required: false
        default: 'guidelines,no_context'
      categories:
        description: 'Optional benchmark categories to run (comma-separated)'
        required: false
        default: ''
      tasks:
        description: 'Optional benchmark task ids/selectors to run (comma-separated)'
        required: false
        default: ''
      dry_run:
        description: 'Run benchmarks without uploading results'
        required: false
        default: 'false'
      post_discord:
        description: 'Post the analysis summary to Discord'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare_matrix:
    name: Prepare benchmark matrix
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.matrix.outputs.languages }}
    steps:
      - id: matrix
        env:
          INPUT_LANGUAGES: ${{ inputs.languages || 'rust,csharp,typescript' }}
        run: |
          languages="$(jq -cn --arg value "$INPUT_LANGUAGES" '$value | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')"
          echo "languages=$languages" >> "$GITHUB_OUTPUT"

  run-benchmarks:
    name: Run benchmarks (${{ matrix.lang }})
    needs: prepare_matrix
    runs-on: spacetimedb-new-runner-2

    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJSON(needs.prepare_matrix.outputs.languages) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Setup .NET SDK
        if: matrix.lang == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install WASI workload
        if: matrix.lang == 'csharp'
        env:
          DOTNET_MULTILEVEL_LOOKUP: "0"
          DOTNET_CLI_HOME: ${{ runner.temp }}/dotnet-home
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
        run: |
          dotnet workload install wasi-experimental --skip-manifest-update --disable-parallel

      - name: Pack C# runtime packages
        if: matrix.lang == 'csharp'
        run: |
          dotnet pack -c Release crates/bindings-csharp/BSATN.Runtime
          dotnet pack -c Release crates/bindings-csharp/Runtime

      - name: Set up Node.js
        if: matrix.lang == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        if: matrix.lang == 'typescript'
        uses: ./.github/actions/setup-pnpm
        with:
          run_install: true

      - name: Build TypeScript SDK
        if: matrix.lang == 'typescript'
        run: pnpm build
        working-directory: crates/bindings-typescript

      - name: Build llm-benchmark tool
        run: cargo install --path tools/xtask-llm-benchmark --locked

      - name: Build SpacetimeDB server for benchmark harness
        run: |
          cargo ci smoketests prepare
          mkdir -p "$HOME/.local/bin"
          ln -sf "$GITHUB_WORKSPACE/target/release/spacetimedb-cli" "$HOME/.local/bin/spacetime"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run benchmarks
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_VENDOR: openrouter
          LLM_BENCHMARK_API_KEY: ${{ secrets.LLM_BENCHMARK_API_KEY }}
          LLM_BENCHMARK_UPLOAD_URL: ${{ vars.LLM_BENCHMARK_UPLOAD_URL }}
          DOTNET_MULTILEVEL_LOOKUP: "0"
          DOTNET_CLI_HOME: ${{ runner.temp }}/dotnet-home
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
          MSBUILDDISABLENODEREUSE: "1"
          DOTNET_CLI_USE_MSBUILD_SERVER: "0"
          LLM_BENCH_CONCURRENCY: "8"
          LLM_BENCH_RUST_CONCURRENCY: "4"
          LLM_BENCH_CSHARP_CONCURRENCY: "2"
          LLM_BENCH_ROUTE_CONCURRENCY: ${{ matrix.lang == 'typescript' && '4' || '2' }}
          LLM_BENCHMARK_REPORT_DIR: ${{ runner.temp }}/llm-benchmark-reports
          INPUT_LANGUAGE: ${{ matrix.lang }}
          INPUT_MODEL_SET: ${{ inputs.model_set || 'website_active' }}
          INPUT_MODELS: ${{ inputs.models || '' }}
          INPUT_MODES: ${{ inputs.modes || 'guidelines,no_context' }}
          INPUT_CATEGORIES: ${{ inputs.categories || '' }}
          INPUT_TASKS: ${{ inputs.tasks || '' }}
          INPUT_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          LANG="$INPUT_LANGUAGE"
          MODEL_SET="$INPUT_MODEL_SET"
          MODELS="$INPUT_MODELS"
          MODES="$INPUT_MODES"
          CATEGORIES="$INPUT_CATEGORIES"
          TASKS="$INPUT_TASKS"
          DRY_RUN="$INPUT_DRY_RUN"

          case "$MODEL_SET" in
            website_active)
              if [ -n "$MODELS" ]; then
                echo "::error::models is only valid when model_set=explicit"
                exit 1
              fi
              ;;
            local_defaults)
              if [ -n "$MODELS" ]; then
                echo "::error::models is only valid when model_set=explicit"
                exit 1
              fi
              ;;
            explicit)
              if [ -z "$MODELS" ]; then
                echo "::error::models is required when model_set=explicit"
                exit 1
              fi
              read -r -a MODEL_ARGS <<< "$MODELS"
              ;;
            *)
              echo "::error::unknown model_set '$MODEL_SET' (expected website_active, local_defaults, or explicit)"
              exit 1
              ;;
          esac

          EXTRA_ARGS=()
          if [ -n "$CATEGORIES" ]; then
            EXTRA_ARGS+=(--categories "$CATEGORIES")
          fi
          if [ -n "$TASKS" ]; then
            EXTRA_ARGS+=(--tasks "$TASKS")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            EXTRA_ARGS+=(--dry-run)
          fi

          if [ "$MODEL_SET" = "website_active" ]; then
            llm_benchmark run --lang "$LANG" --modes "$MODES" --model-source remote "${EXTRA_ARGS[@]}"
          elif [ "$MODEL_SET" = "local_defaults" ]; then
            llm_benchmark run --lang "$LANG" --modes "$MODES" "${EXTRA_ARGS[@]}"
          else
            llm_benchmark run --lang "$LANG" --modes "$MODES" --models "${MODEL_ARGS[@]}" "${EXTRA_ARGS[@]}"
          fi

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-benchmark-analysis-${{ matrix.lang }}
          path: ${{ runner.temp }}/llm-benchmark-reports
          if-no-files-found: ignore
          retention-days: 14

  summarize:
    name: Summarize benchmark analysis
    if: always()
    needs: run-benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Download analysis reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: llm-benchmark-analysis-*
          path: reports
          merge-multiple: true

      - name: Publish workflow summary
        run: |
          echo "# LLM benchmark analysis" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"

          if [ ! -d reports ] || ! find reports -type f -name '*.md' -print -quit | grep -q .; then
            echo "No analysis reports were produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Full per-model reports are available in the workflow artifacts." >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"

          find reports -type f -name '*.md' -print | sort | while IFS= read -r report; do
            awk '/^## Failure patterns/{exit} NR <= 80 {print}' "$report" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "---" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Prepare Discord summary
        if: github.event_name == 'schedule' || inputs.post_discord
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_LABEL: ${{ github.event_name == 'schedule' && 'Weekly scheduled run' || 'Manual run' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from collections import defaultdict
          from pathlib import Path

          reports = sorted(Path("reports").rglob("*.md"))
          totals = [0, 0]
          by_language = defaultdict(lambda: [0, 0])
          actions = []
          other_findings = []

          def language_name(language):
              return {
                  "csharp": "C#",
                  "rust": "Rust",
                  "typescript": "TypeScript",
              }.get(language, language)

          for report in reports:
              text = report.read_text(encoding="utf-8")

              def field(name):
                  match = re.search(rf"^- {name}: (.+)$", text, re.MULTILINE)
                  return match.group(1) if match else "unknown"

              language = field("Language")
              mode = field("Mode")
              model = field("Model")
              tasks = re.match(r"(\d+)/(\d+)", field("Tasks"))
              if tasks:
                  passed, total = map(int, tasks.groups())
                  totals[0] += passed
                  totals[1] += total
                  by_language[language][0] += passed
                  by_language[language][1] += total

              recommended = text.partition("## Recommended actions")[2].partition("## Failure patterns")[0]
              for line in recommended.splitlines():
                  action = f"- {language_name(language)} / {mode}: {line[2:]}"
                  if line.startswith("- **[") and action not in actions:
                      actions.append(action)

              failures = text.partition("## Failure patterns")[2]
              for section in failures.split("\n### ")[1:]:
                  title = section.splitlines()[0].rsplit(" (", 1)[0]
                  classification = re.search(r"^- \*\*Classification:\*\* (.+)$", section, re.MULTILINE)
                  if classification and classification.group(1) in {
                      "Model limitation",
                      "Infrastructure/provider problem",
                      "No action",
                  }:
                      finding = (
                          f"- {language_name(language)} / {mode} / {model}: "
                          f"{title} - {classification.group(1)}"
                      )
                      if finding not in other_findings:
                          other_findings.append(finding)

          def rate(passed, total):
              percent = passed * 100 / total if total else 0
              return f"{passed}/{total} ({percent:.1f}%)"

          def field_value(lines, empty, overflow_label):
              visible = lines[:5] or [empty]
              if len(lines) > 5:
                  visible.append(f"- ...and {len(lines) - 5} more {overflow_label}(s)")
              value = "\n".join(visible)
              return value if len(value) <= 1000 else value[:970].rstrip() + "\n... View the full analysis."

          passed, total = totals
          pass_percent = passed * 100 / total if total else 0
          has_infrastructure_failure = any("Infrastructure/provider problem" in item for item in other_findings)
          if not total or pass_percent < 90 or has_infrastructure_failure:
              color = 0xED4245
          elif actions or pass_percent < 95:
              color = 0xFEE75C
          else:
              color = 0x57F287

          language_rates = [
              f"- **{language_name(language)}:** {rate(*counts)}"
              for language, counts in sorted(by_language.items())
          ]
          payload = {
              "username": "SpacetimeDB LLM Benchmarks",
              "embeds": [
                  {
                      "title": "LLM Benchmark Analysis",
                      "url": os.environ["RUN_URL"],
                      "description": f"**{rate(*totals)}** task runs passed",
                      "color": color,
                      "fields": [
                          {
                              "name": "By language",
                              "value": field_value(
                                  language_rates,
                                  "No analysis reports were produced.",
                                  "language",
                              ),
                              "inline": False,
                          },
                          {
                              "name": "Action items",
                              "value": field_value(actions, "None", "action"),
                              "inline": False,
                          },
                          {
                              "name": "Other failures",
                              "value": field_value(other_findings, "None", "finding"),
                              "inline": False,
                          },
                      ],
                      "footer": {"text": os.environ["RUN_LABEL"]},
                  }
              ],
          }
          Path("discord-payload.json").write_text(
              json.dumps(payload, ensure_ascii=False),
              encoding="utf-8",
          )
          PY

      - name: Post Discord summary
        if: github.event_name == 'schedule' || inputs.post_discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.LLM_BENCHMARK_DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::LLM_BENCHMARK_DISCORD_WEBHOOK_URL is not configured"
            exit 0
          fi

          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data-binary @discord-payload.json \
            "$DISCORD_WEBHOOK_URL"
