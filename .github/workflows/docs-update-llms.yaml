name: Docs / Update llms files

permissions:
  contents: write

on:
  push:
    branches:
      - docs/release
    paths:
      - 'docs/docs/**'
      - 'skills/**'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-llms:
    # This runs the same memory-intensive Docusaurus build as docs publishing.
    runs-on: spacetimedb-linux
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: jdetter-openclaw/llms-signing-e2e-test

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - uses: ./.github/actions/setup-pnpm
        with:
          run_install: true

      - name: Install dependencies
        working-directory: docs
        run: pnpm install

      - name: Docusaurus build
        working-directory: docs
        run: pnpm build

      - name: Generate llms files
        working-directory: docs
        run: node scripts/generate-llms.mjs

      - name: Commit updated llms files
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const { execFileSync } = require('node:child_process');

            const branch = 'jdetter-openclaw/llms-signing-e2e-test';
            const path = 'docs/static/llms.md';
            const generated = fs.readFileSync(path);
            const current = await github.rest.repos.getContent({
              ...context.repo,
              path,
              ref: branch,
            });

            if (Buffer.from(current.data.content, 'base64').equals(generated)) {
              core.info('No changes');
              return;
            }

            const expectedHeadOid = execFileSync(
              'git',
              ['rev-parse', 'HEAD'],
              { encoding: 'utf8' },
            ).trim();

            await github.graphql(`
              mutation($input: CreateCommitOnBranchInput!) {
                createCommitOnBranch(input: $input) {
                  commit {
                    oid
                    url
                  }
                }
              }
            `, {
              input: {
                branch: {
                  repositoryNameWithOwner: `${context.repo.owner}/${context.repo.repo}`,
                  branchName: branch,
                },
                expectedHeadOid,
                message: {
                  headline: 'Update llms files from docs build',
                },
                fileChanges: {
                  additions: [{
                    path,
                    contents: generated.toString('base64'),
                  }],
                },
              },
            });
