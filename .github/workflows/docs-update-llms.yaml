name: Docs / Update llms files

permissions:
  contents: write

on:
  push:
    branches:
      - docs/release
    paths:
      - 'docs/docs/**'
      - 'skills/**'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-llms:
    # This runs the same memory-intensive Docusaurus build as docs publishing.
    runs-on: spacetimedb-linux
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: docs/release

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - uses: ./.github/actions/setup-pnpm
        with:
          run_install: true

      - name: Install dependencies
        working-directory: docs
        run: pnpm install

      - name: Docusaurus build
        working-directory: docs
        run: pnpm build

      - name: Generate llms files
        working-directory: docs
        run: node scripts/generate-llms.mjs

      - name: Commit updated llms files
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const branch = 'docs/release';
            const path = 'docs/static/llms.md';
            if (await exec.exec('git', ['diff', '--quiet', '--', path], {
              ignoreReturnCode: true,
            }) === 0) return;

            await github.graphql(`
              mutation($input: CreateCommitOnBranchInput!) {
                createCommitOnBranch(input: $input) { commit { oid } }
              }
            `, {
              input: {
                branch: {
                  repositoryNameWithOwner: `${context.repo.owner}/${context.repo.repo}`,
                  branchName: branch,
                },
                expectedHeadOid: (await exec.getExecOutput(
                  'git', ['rev-parse', 'HEAD']
                )).stdout.trim(),
                message: { headline: 'Update llms files from docs build' },
                fileChanges: {
                  additions: [{
                    path,
                    contents: fs.readFileSync(path, 'base64'),
                  }],
                },
              },
            });
