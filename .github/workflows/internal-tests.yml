name: Internal Tests

on:
  pull_request:
  push:
    branches:
      - master
  merge_group:
  workflow_dispatch:

run-name: Internal Tests [ref=${{ github.ref }}]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  internal-tests:
    name: Internal Tests
    # Skip if not a PR or a push to master
    # Skip if this is an external contribution. GitHub secrets will be empty, so the step would fail anyway.
    if: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master'))
      && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
    runs-on: ubuntu-latest
    env:
      TARGET_OWNER: clockworklabs
      TARGET_REPO: SpacetimeDBPrivate
    steps:
      # Required for the path filter check below on non-PR commits (e.g. `master`)
      - name: Checkout
        uses: actions/checkout@v4

      # Skip the private dispatch entirely when only `docs/` is touched. The job
      # itself still completes successfully so required-status-check gating is
      # satisfied without spending private-runner time on a docs-only change.
      - name: Detect non-docs changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            non_docs:
              - '!docs/**'

      - id: dispatch
        name: Trigger tests
        if: steps.filter.outputs.non_docs == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SPACETIMEDB_PRIVATE_TOKEN }}
          script: |
            const workflowId = 'ci.yml';
            const targetOwner = process.env.TARGET_OWNER;
            const targetRepo = process.env.TARGET_REPO;
            // Use the ref for pull requests because the head sha is brittle (github does some extra dance where it merges in master).
            const publicRef = (context.eventName === 'pull_request') ? context.payload.pull_request.head.ref : context.sha;
            const publicPrNumber = context.payload.pull_request?.number;
            const inputs = { public_ref: publicRef };
            let targetRef = 'master';

            if (publicPrNumber) {
              // GitHub constructs the job graph from the dispatched ref before
              // ci-setup can check out related sources. Dispatch the companion
              // branch itself so workflow changes in that PR are exercised too.
              const timeline = await github.paginate(github.rest.issues.listEventsForTimeline, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: publicPrNumber,
                per_page: 100,
              });
              const privatePrNumbers = [
                ...new Set(
                  timeline
                    .filter(event => event.event === 'cross-referenced')
                    .map(event => event.source?.issue)
                    .filter(issue =>
                      issue?.repository?.full_name === `${targetOwner}/${targetRepo}`
                      && issue.pull_request
                      && issue.state === 'open'
                    )
                    .map(issue => issue.number)
                ),
              ];

              if (privatePrNumbers.length > 1) {
                core.setFailed(
                  `Multiple open ${targetOwner}/${targetRepo} PRs reference public PR #${publicPrNumber}: `
                  + privatePrNumbers.map(number => `#${number}`).join(', ')
                );
                return;
              }

              if (privatePrNumbers.length === 1) {
                const privatePrNumber = privatePrNumbers[0];
                const privatePr = await github.rest.pulls.get({
                  owner: targetOwner,
                  repo: targetRepo,
                  pull_number: privatePrNumber,
                });
                const privateHeadRepo = privatePr.data.head.repo?.full_name;
                if (privateHeadRepo !== `${targetOwner}/${targetRepo}`) {
                  core.setFailed(
                    `Refusing to run a workflow from related private PR #${privatePrNumber}: `
                    + `expected head repository ${targetOwner}/${targetRepo}, got ${privateHeadRepo || 'unknown'}`
                  );
                  return;
                }

                targetRef = privatePr.data.head.ref;
                inputs.public_pr_number = String(publicPrNumber);
                core.info(`Using related private PR #${privatePrNumber} workflow from ${targetRef}.`);
              } else {
                // No private companion exists, so run the private master workflow
                // and let setup use the public PR with the private master sources.
                inputs.public_pr_number = String(publicPrNumber);
              }
            }

            // Dispatch the workflow in the target repository
            const dispatchResp = await github.rest.actions.createWorkflowDispatch({
              owner: targetOwner,
              repo: targetRepo,
              workflow_id: workflowId,
              ref: targetRef,
              inputs,
              return_run_details: true,
            });

            const runId = dispatchResp.data.workflow_run_id;
            const runUrl = dispatchResp.data.html_url;
            if (!runId || !runUrl) {
              core.setFailed(`Dispatch response did not include run details: ${JSON.stringify(dispatchResp.data)}`);
              return;
            }

            core.info(`View run: ${runUrl}`);
            core.setOutput('run_id', String(runId));
            core.setOutput('run_url', runUrl);

      - name: Wait for Internal Tests to complete
        if: steps.filter.outputs.non_docs == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SPACETIMEDB_PRIVATE_TOKEN }}
          script: |
            const targetOwner = process.env.TARGET_OWNER;
            const targetRepo = process.env.TARGET_REPO;
            const runId = Number(`${{ steps.dispatch.outputs.run_id }}`);
            const runUrl = `${{ steps.dispatch.outputs.run_url }}`;
            const sleep = (ms) => new Promise(r => setTimeout(r, ms));

            core.info(`Waiting for workflow result... ${runUrl}`);

            let conclusion = null;
            for (let attempt = 0; attempt < 240; attempt++) { // up to ~2 hours
              const runResp = await github.rest.actions.getWorkflowRun({
                owner: targetOwner,
                repo: targetRepo,
                run_id: runId
              });
              const { status, conclusion: c } = runResp.data;
              if (status === 'completed') {
                conclusion = c || 'success';
                break;
              }
              await sleep(30000);
            }

            if (!conclusion) {
              core.setFailed('Timed out waiting for private workflow to complete.');
              return;
            }

            if (conclusion !== 'success') {
              core.setFailed(`Private workflow failed with conclusion: ${conclusion}`);
            }

      - name: Cancel invoked run if workflow cancelled
        if: ${{ cancelled() && steps.dispatch.outputs.run_id }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SPACETIMEDB_PRIVATE_TOKEN }}
          script: |
            const targetOwner = process.env.TARGET_OWNER;
            const targetRepo = process.env.TARGET_REPO;
            const runId = Number(`${{ steps.dispatch.outputs.run_id }}`);
            if (!runId) return;
            await github.rest.actions.cancelWorkflowRun({
              owner: targetOwner,
              repo: targetRepo,
              run_id: runId,
            });
