# `SPACETIMEDB_PRIVATE_TOKEN` needs Actions read/write, Contents read, and Pull
# requests read access to clockworklabs/SpacetimeDBPrivate.
name: Internal Tests

on:
  pull_request:
  push:
    branches:
      - master
  merge_group:
  workflow_dispatch:

run-name: Internal Tests [ref=${{ github.ref }}]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  internal-tests:
    name: Internal Tests
    # Skip if not a PR or a push to master
    # Skip if this is an external contribution. GitHub secrets will be empty, so the step would fail anyway.
    if: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master'))
      && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
    runs-on: ubuntu-latest
    env:
      TARGET_OWNER: clockworklabs
      TARGET_REPO: SpacetimeDBPrivate
    steps:
      # Required for the path filter check below on non-PR commits (e.g. `master`)
      - name: Checkout
        uses: actions/checkout@v4

      # Skip the private dispatch entirely when only `docs/` is touched. The job
      # itself still completes successfully so required-status-check gating is
      # satisfied without spending private-runner time on a docs-only change.
      - name: Detect non-docs changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            non_docs:
              - '!docs/**'

      # TODO(rollout): Remove this bootstrap checkout and the private-tools
      # resolver below once both rollout PRs have merged. At that point the
      # private CI tools checkout can always use `ref: master` directly.
      # Private master already has find-related-pr, so it can bootstrap the
      # coordinator from a linked private PR before that PR has merged.
      - name: Checkout private lookup tools
        if: steps.filter.outputs.non_docs == 'true' && github.event.pull_request.number
        uses: actions/checkout@v4
        with:
          repository: clockworklabs/SpacetimeDBPrivate
          ref: master
          path: .private-ci-bootstrap
          token: ${{ secrets.SPACETIMEDB_PRIVATE_TOKEN }}
          submodules: true

      - id: private-tools
        name: Resolve private CI tools ref
        if: steps.filter.outputs.non_docs == 'true'
        working-directory: ${{ github.event.pull_request.number && '.private-ci-bootstrap' || '.' }}
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/internal-tests-cargo-target
          GH_TOKEN: ${{ secrets.SPACETIMEDB_PRIVATE_TOKEN }}
          PUBLIC_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          private_ref=master
          if [[ -n "$PUBLIC_PR_NUMBER" ]]; then
            related="$(
              cargo run --quiet \
                --manifest-path tools/find-related-pr/Cargo.toml \
                -- prs-mentioning \
                --pr "$PUBLIC_PR_NUMBER" \
                --in clockworklabs/SpacetimeDB \
                --from clockworklabs/SpacetimeDBPrivate
            )"
            if [[ -n "$related" ]]; then
              private_pr_number="$(jq -r '.number' <<<"$related")"
              private_ref="$(
                gh api "/repos/clockworklabs/SpacetimeDBPrivate/pulls/$private_pr_number" \
                  --jq '.head.sha'
              )"
              echo "Using private PR #$private_pr_number CI tools at $private_ref."
            fi
          fi
          echo "ref=$private_ref" >>"$GITHUB_OUTPUT"

      - name: Checkout private CI tools
        if: steps.filter.outputs.non_docs == 'true'
        uses: actions/checkout@v4
        with:
          repository: clockworklabs/SpacetimeDBPrivate
          # TODO(rollout): Change this to `master` after removing private-tools.
          ref: ${{ steps.private-tools.outputs.ref }}
          path: .private-ci
          token: ${{ secrets.SPACETIMEDB_PRIVATE_TOKEN }}
          submodules: true

      # TODO(rollout): Remove this detection step once the coordinator is on
      # private master, and remove its condition from the dispatch step.
      - id: coordinator
        name: Detect Rust coordinator
        if: steps.filter.outputs.non_docs == 'true'
        run: |
          if [[ -f .private-ci/private/crates/ci/src/internal_tests.rs ]]; then
            echo 'available=true' >>"$GITHUB_OUTPUT"
          else
            echo 'available=false' >>"$GITHUB_OUTPUT"
          fi

      - id: dispatch
        name: Select or trigger tests
        if: steps.filter.outputs.non_docs == 'true' && steps.coordinator.outputs.available == 'true'
        working-directory: .private-ci
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/internal-tests-cargo-target
          GH_TOKEN: ${{ secrets.SPACETIMEDB_PRIVATE_TOKEN }}
          PUBLIC_PR_NUMBER: ${{ github.event.pull_request.number }}
          PUBLIC_RUN_ATTEMPT: ${{ github.run_attempt }}
          PUBLIC_RUN_ID: ${{ github.run_id }}
          PUBLIC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          args=(
            --public-run-id "$PUBLIC_RUN_ID"
            --public-run-attempt "$PUBLIC_RUN_ATTEMPT"
            --public-sha "$PUBLIC_SHA"
          )
          if [[ -n "$PUBLIC_PR_NUMBER" ]]; then
            args+=(--public-pr-number "$PUBLIC_PR_NUMBER")
          fi
          cargo run --quiet \
            --manifest-path private/crates/ci/Cargo.toml \
            -- coordinate-internal-tests "${args[@]}"

      # TODO(rollout): Remove this entire compatibility path once both rollout
      # PRs have merged. It is used after the public workflow merges but before
      # the Rust coordinator reaches private master.
      - id: legacy-dispatch
        name: Trigger tests with legacy private CI
        if: steps.filter.outputs.non_docs == 'true' && steps.coordinator.outputs.available != 'true'
        env:
          GH_TOKEN: ${{ secrets.SPACETIMEDB_PRIVATE_TOKEN }}
          PUBLIC_PR_NUMBER: ${{ github.event.pull_request.number }}
          PUBLIC_REF: ${{ github.event.pull_request.head.ref || github.sha }}
        run: |
          set -euo pipefail
          request="$(
            jq --null-input --compact-output \
              --arg public_ref "$PUBLIC_REF" \
              --arg public_pr_number "$PUBLIC_PR_NUMBER" \
              '{
                ref: "master",
                inputs: {public_ref: $public_ref},
                return_run_details: true
              }
              | if $public_pr_number == ""
                then .
                else .inputs.public_pr_number = $public_pr_number
                end'
          )"
          response="$(
            gh api --method POST --input - \
              "/repos/$TARGET_OWNER/$TARGET_REPO/actions/workflows/ci.yml/dispatches" \
              <<<"$request"
          )"
          run_id="$(jq -er '.workflow_run_id' <<<"$response")"
          run_url="$(jq -er '.html_url' <<<"$response")"
          echo "View run: $run_url"
          echo "run_id=$run_id" >>"$GITHUB_OUTPUT"
          echo "run_url=$run_url" >>"$GITHUB_OUTPUT"

      - name: Wait for Internal Tests to complete
        if: steps.filter.outputs.non_docs == 'true'
        env:
          GH_TOKEN: ${{ secrets.SPACETIMEDB_PRIVATE_TOKEN }}
          # TODO(rollout): Use only steps.dispatch.outputs after removing the
          # legacy-dispatch step.
          RUN_ID: ${{ steps.dispatch.outputs.run_id || steps.legacy-dispatch.outputs.run_id }}
          RUN_URL: ${{ steps.dispatch.outputs.run_url || steps.legacy-dispatch.outputs.run_url }}
        run: |
          set -euo pipefail
          echo "Waiting for workflow result... ${RUN_URL}"
          set +e
          # Due to our limited-scope token permissions, `gh run watch` spams errors about not being able to get annotations. They look worrying but they're benign, so we filter them out.
          gh run watch "$RUN_ID" \
            --repo "$TARGET_OWNER/$TARGET_REPO" \
            --exit-status \
            --interval 30 2>&1 \
            | grep -Fv "requesting annotations returned 403 Forbidden as the token does not have sufficient permissions"
          watch_status="${PIPESTATUS[0]}"
          set -e
          exit "$watch_status"

      - name: Cancel coordinated run if workflow cancelled
        if: ${{ cancelled() && steps.dispatch.outputs.run_id && steps.dispatch.outputs.cancel_on_cancel == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.SPACETIMEDB_PRIVATE_TOKEN }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: gh run cancel "$RUN_ID" --repo "$TARGET_OWNER/$TARGET_REPO"

      # TODO(rollout): Remove with the legacy-dispatch step.
      - name: Cancel legacy run if workflow cancelled
        if: ${{ cancelled() && steps.legacy-dispatch.outputs.run_id }}
        env:
          GH_TOKEN: ${{ secrets.SPACETIMEDB_PRIVATE_TOKEN }}
          RUN_ID: ${{ steps.legacy-dispatch.outputs.run_id }}
        run: gh run cancel "$RUN_ID" --repo "$TARGET_OWNER/$TARGET_REPO"
