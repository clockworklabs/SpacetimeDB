# `SPACETIMEDB_PRIVATE_TOKEN` needs Actions read/write, Contents read, and Pull
# requests read access to clockworklabs/SpacetimeDBPrivate.
name: Internal Tests

on:
  pull_request:
  push:
    branches:
      - master
  merge_group:
  workflow_dispatch:

run-name: Internal Tests [ref=${{ github.ref }}]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  internal-tests:
    name: Internal Tests
    # Skip if not a PR or a push to master
    # Skip if this is an external contribution. GitHub secrets will be empty, so the step would fail anyway.
    if: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master'))
      && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
    runs-on: ubuntu-latest
    env:
      TARGET_OWNER: clockworklabs
      TARGET_REPO: SpacetimeDBPrivate
    steps:
      # Required for the path filter check below on non-PR commits (e.g. `master`)
      - name: Checkout
        uses: actions/checkout@v4

      # Skip the private dispatch entirely when only `docs/` is touched. The job
      # itself still completes successfully so required-status-check gating is
      # satisfied without spending private-runner time on a docs-only change.
      - name: Detect non-docs changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            non_docs:
              - '!docs/**'

      - id: dispatch
        name: Select or trigger tests
        if: steps.filter.outputs.non_docs == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SPACETIMEDB_PRIVATE_TOKEN }}
          script: |
            const workflowId = 'ci.yml';
            const defaultPrivateRef = 'master';
            const targetOwner = process.env.TARGET_OWNER;
            const targetRepo = process.env.TARGET_REPO;
            const targetFullName = `${targetOwner}/${targetRepo}`;
            const publicSha = context.payload.pull_request?.head.sha ?? context.sha;
            const publicPrNumber = context.payload.pull_request?.number;

            const newest = (runs) => runs.sort((a, b) =>
              b.created_at.localeCompare(a.created_at) || b.id - a.id
            )[0];

            const listRuns = async (event, headSha) => {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: targetOwner,
                repo: targetRepo,
                workflow_id: workflowId,
                event,
                head_sha: headSha,
                per_page: 100,
              });
              return runs.filter((run) => run.event === event && run.head_sha === headSha);
            };

            const findRelatedPrivatePr = async () => {
              if (!publicPrNumber) return undefined;

              const events = await github.paginate(github.rest.issues.listEventsForTimeline, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: publicPrNumber,
                per_page: 100,
              });
              const numbers = [...new Set(events
                .filter((event) =>
                  event.event === 'cross-referenced' &&
                  event.source?.issue?.repository?.full_name === targetFullName &&
                  event.source.issue.pull_request
                )
                .map((event) => event.source.issue.number))];

              const pulls = [];
              for (const pullNumber of numbers) {
                const { data: pull } = await github.rest.pulls.get({
                  owner: targetOwner,
                  repo: targetRepo,
                  pull_number: pullNumber,
                });
                if (pull.state === 'open' && pull.head.repo?.full_name === targetFullName) {
                  pulls.push(pull);
                }
              }

              if (pulls.length > 1) {
                throw new Error('Found multiple open linked private PRs.');
              }
              return pulls[0];
            };

            const relatedPull = await findRelatedPrivatePr();
            let privateRef = defaultPrivateRef;
            let privateSha;
            let matchingPullRequestRun;

            if (relatedPull) {
              core.info('Found a linked private PR.');
              privateRef = relatedPull.head.ref;
              privateSha = relatedPull.head.sha;

              const { data: tree } = await github.rest.git.getTree({
                owner: targetOwner,
                repo: targetRepo,
                tree_sha: privateSha,
              });
              const privatePublicSha = tree.tree.find((entry) =>
                entry.path === 'public' && entry.type === 'commit'
              )?.sha;

              if (!privatePublicSha) {
                throw new Error('The linked private PR does not contain a public submodule entry.');
              }

              if (privatePublicSha === publicSha) {
                const pullRequestRuns = await listRuns('pull_request', privateSha);
                matchingPullRequestRun = newest(pullRequestRuns.filter((run) =>
                  run.pull_requests?.some((pull) =>
                    pull.number === relatedPull.number && pull.head?.sha === privateSha
                  )
                ));
              }
            } else {
              core.info('No linked private PR; using private master.');
              const { data: branch } = await github.rest.repos.getBranch({
                owner: targetOwner,
                repo: targetRepo,
                branch: defaultPrivateRef,
              });
              privateSha = branch.commit.sha;
            }

            let selectedRun = matchingPullRequestRun;
            if (selectedRun) {
              core.info('Reusing the linked private PR run for this public/private SHA pair.');
            } else {
              const expectedTitle = `CI [public_ref=${publicSha}]`;
              const dispatchRuns = await listRuns('workflow_dispatch', privateSha);
              selectedRun = newest(dispatchRuns.filter((run) => run.display_title === expectedTitle));

              if (selectedRun) {
                if (selectedRun.status === 'completed' && selectedRun.conclusion !== 'success') {
                  core.info('Re-running unsuccessful jobs in the existing private run.');
                  const previousAttempt = selectedRun.run_attempt;
                  await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun-failed-jobs', {
                    owner: targetOwner,
                    repo: targetRepo,
                    run_id: selectedRun.id,
                  });

                  for (let attempt = 0; attempt < 30; attempt++) {
                    await new Promise((resolve) => setTimeout(resolve, 2000));
                    const { data: refreshed } = await github.rest.actions.getWorkflowRun({
                      owner: targetOwner,
                      repo: targetRepo,
                      run_id: selectedRun.id,
                    });
                    if (refreshed.run_attempt > previousAttempt || refreshed.status !== 'completed') {
                      selectedRun = refreshed;
                      break;
                    }
                  }

                  if (selectedRun.run_attempt === previousAttempt && selectedRun.status === 'completed') {
                    throw new Error(`Timed out waiting for private run ${selectedRun.id} to start its rerun.`);
                  }
                } else {
                  core.info('Reusing the existing private run for this public/private SHA pair.');
                }
              } else {
                const dispatchResp = await github.rest.actions.createWorkflowDispatch({
                  owner: targetOwner,
                  repo: targetRepo,
                  workflow_id: workflowId,
                  ref: privateRef,
                  inputs: { public_ref: publicSha },
                  return_run_details: true,
                });

                const runId = dispatchResp.data.workflow_run_id;
                const runUrl = dispatchResp.data.html_url;
                if (!runId || !runUrl) {
                  throw new Error('Dispatch response did not include run details.');
                }

                selectedRun = { id: runId, html_url: runUrl };
                core.setOutput('did_dispatch', 'true');
                core.info('Dispatched a new private run for this public/private SHA pair.');
              }
            }

            core.info(`View run: ${selectedRun.html_url}`);
            core.setOutput('run_id', String(selectedRun.id));
            core.setOutput('run_url', selectedRun.html_url);

      - name: Wait for Internal Tests to complete
        if: steps.filter.outputs.non_docs == 'true'
        env:
          GH_TOKEN: ${{ secrets.SPACETIMEDB_PRIVATE_TOKEN }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          RUN_URL: ${{ steps.dispatch.outputs.run_url }}
        run: |
          set -euo pipefail
          echo "Waiting for workflow result... ${RUN_URL}"
          set +e
          # Due to our limited-scope token permissions, `gh run watch` spams errors about not being able to get annotations. They look worrying but they're benign, so we filter them out.
          gh run watch "$RUN_ID" \
            --repo "$TARGET_OWNER/$TARGET_REPO" \
            --exit-status \
            --interval 30 2>&1 \
            | grep -Fv "requesting annotations returned 403 Forbidden as the token does not have sufficient permissions"
          watch_status="${PIPESTATUS[0]}"
          set -e
          exit "$watch_status"

      - name: Cancel invoked run if workflow cancelled
        if: ${{ cancelled() && steps.dispatch.outputs.run_id && steps.dispatch.outputs.did_dispatch == 'true' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SPACETIMEDB_PRIVATE_TOKEN }}
          script: |
            const targetOwner = process.env.TARGET_OWNER;
            const targetRepo = process.env.TARGET_REPO;
            const runId = Number(`${{ steps.dispatch.outputs.run_id }}`);
            if (!runId) return;
            await github.rest.actions.cancelWorkflowRun({
              owner: targetOwner,
              repo: targetRepo,
              run_id: runId,
            });
