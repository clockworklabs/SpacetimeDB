name: Git tree checks

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
  merge_group:
permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }} # Temporary small-runner saturation test.
  cancel-in-progress: false

jobs:
  check_base_ref:
    name: Based on `master`
    # This only evaluates the event base ref and performs no build.
    runs-on: spacetimedb-linux-small-staging
    steps:
      - id: not_based_on_master
        if: |
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref != 'master'
        run: |
          echo "This PR is not based on master. Please wait until the base PR merges."
          exit 1

  release_dependencies:
    if: ${{ github.event_name == 'pull_request' }}
    name: Check release dependencies
    # This builds a small CI helper and inspects release metadata and git history.
    runs-on: spacetimedb-linux-small-staging
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUST_LOG: rollback_coordination=info
    steps:
      - uses: actions/checkout@v4
        with:
          # We inspect local tags and git commits in order to determine whether things have been released
          fetch-depth: 0
      - uses: dsherret/rust-toolchain-file@v1
      - name: Check release dependencies
        run: >-
          cargo ci other-workflows check-release-deps
          --current-repo .
          --allowed-reference-repo .
          --pr-number "${{ github.event.pull_request.number }}"
