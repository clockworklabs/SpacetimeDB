# GitHub-hosted runner images can still trust the compromised eMudhra/emSign CAs.
# Centralize the workaround here so CI tools use a filtered certificate bundle
# until upstream images are fixed. rustup carries its own CA bundle, so invoke
# ensure-rustup as well to refresh that independent trust store.
name: Set up certificate trust
description: Correct hosted-runner certificate trust and update rustup without changing Rust toolchains
# This protects subsequent requests. Checkout and GitHub's action downloads happen
# before setup and rely on the runner's original certificate trust.
# That's unfortunate but can't really be helped.
runs:
  using: composite
  steps:
    # Hosted images may still trust the compromised eMudhra/emSign certificate chains.
    - name: Configure hosted-runner certificate trust
      if: runner.environment == 'github-hosted'
      shell: bash
      run: node "$GITHUB_ACTION_PATH/configure-trust.cjs"

    - name: Update rustup certificate trust
      uses: ./.github/actions/ensure-rustup
