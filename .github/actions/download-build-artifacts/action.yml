name: Download build artifacts
description: Download the prebuilt CLI and standalone binary shared by smoketest jobs.

inputs:
  artifact-suffix:
    description: Platform suffix used by the build artifact.
    required: true

runs:
  using: composite
  steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts-${{ inputs.artifact-suffix }}
        path: ${{ runner.temp }}/build-artifacts

    - name: Extract build artifacts
      shell: bash
      run: |
        tar -xzf "${RUNNER_TEMP}/build-artifacts/build-support.tar.gz"
        exe_suffix=""
        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          exe_suffix=".exe"
        fi
        test -f "${CARGO_TARGET_DIR}/release/spacetimedb-cli${exe_suffix}"
        test -f "${CARGO_TARGET_DIR}/release/spacetimedb-standalone${exe_suffix}"
