name: Check Unity metadata
description: Run the upstream metadata checker with corrected container trust
inputs:
  log_level:
    description: Upstream log level
    default: INFO
  target_type:
    description: Upstream project detection mode
    default: auto-detect
  pr_comment_lang:
    description: Language for pull request comments
    default: en
  target_path:
    description: Directory to check
    default: .
  enable_pr_comment:
    description: Report results on the pull request
    default: "false"
runs:
  using: docker
  image: Dockerfile
  args:
    - -inputs-json
    - '${{ toJSON(inputs) }}'
