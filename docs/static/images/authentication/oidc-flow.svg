<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How Spacetime verifies an OIDC token</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b6c0cf"/>
    </marker>
    <style>
      .lane { stroke: #363840; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .head { fill: #162d38; stroke: #4cf49080; stroke-width: 1.5; }
      .headsub { font-size: 12px; fill: #b6c0cf; text-anchor: middle; }
      .headtext { font-size: 15px; font-weight: 600; fill: #e6e9f0; text-anchor: middle; }
      .msg { stroke: #b6c0cf; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .reply { stroke: #b6c0cf; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .label { font-size: 13px; fill: #ced3e0; text-anchor: middle; paint-order: stroke; stroke: #0e161a; stroke-width: 5px; stroke-linejoin: round; }
      .sub { font-size: 12px; fill: #fbdc8e; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; paint-order: stroke; stroke: #0e161a; stroke-width: 5px; stroke-linejoin: round; }
      .note { fill: #4cf4901a; stroke: #4cf490; stroke-width: 1.2; }
      .notetext { font-size: 12.5px; fill: #e6e9f0; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="499" rx="12" fill="#0e161a" stroke="#162d38"/>

  <!-- Lifelines -->
  <line class="lane" x1="110" y1="64" x2="110" y2="480"/>
  <line class="lane" x1="330" y1="64" x2="330" y2="480"/>
  <line class="lane" x1="550" y1="64" x2="550" y2="480"/>
  <line class="lane" x1="770" y1="64" x2="770" y2="480"/>

  <!-- Participants -->
  <rect class="head" x="15" y="20" width="190" height="44" rx="8"/>
  <text class="headtext" x="110" y="47">Your client</text>
  <rect class="head" x="235" y="20" width="190" height="44" rx="8"/>
  <text class="headtext" x="330" y="40">OIDC provider</text>
  <text class="headsub" x="330" y="57">(SpacetimeAuth or your own)</text>
  <rect class="head" x="455" y="20" width="190" height="44" rx="8"/>
  <text class="headtext" x="550" y="40">Upstream login</text>
  <text class="headsub" x="550" y="57">(optional, e.g. Google)</text>
  <rect class="head" x="675" y="20" width="190" height="44" rx="8"/>
  <text class="headtext" x="770" y="47">Spacetime</text>

  <!-- 1. Sign in -->
  <line class="msg" x1="110" y1="105" x2="326" y2="105"/>
  <text class="label" x="220" y="97">1. Sign in</text>

  <!-- 2. Upstream login -->
  <line class="msg" x1="330" y1="145" x2="546" y2="145"/>
  <text class="label" x="440" y="137">2. Verify the user</text>
  <line class="reply" x1="550" y1="175" x2="334" y2="175"/>
  <text class="label" x="440" y="167">user is verified</text>

  <!-- 3. Token issued -->
  <line class="reply" x1="330" y1="225" x2="114" y2="225"/>
  <text class="label" x="220" y="217">3. Signed JWT</text>
  <text class="sub" x="220" y="243">{ iss, sub, aud, iat, exp }</text>

  <!-- 4. Connect -->
  <line class="msg" x1="110" y1="290" x2="766" y2="290"/>
  <text class="label" x="440" y="282">4. Connect with the JWT</text>

  <!-- 5. Key discovery -->
  <line class="msg" x1="770" y1="340" x2="334" y2="340"/>
  <text class="label" x="550" y="332">5. Fetch the provider's public keys (cached)</text>
  <text class="sub" x="550" y="358">GET {iss}/.well-known/openid-configuration, then jwks_uri</text>
  <line class="reply" x1="330" y1="398" x2="766" y2="398"/>
  <text class="label" x="550" y="390">JSON Web Key Set</text>

  <!-- 6. Verify -->
  <rect class="note" x="608" y="414" width="252" height="70" rx="6"/>
  <text class="notetext" x="620" y="434">6. Check the signature and expiry,</text>
  <text class="notetext" x="620" y="452">derive the Identity from iss + sub,</text>
  <text class="notetext" x="620" y="470">then run client_connected</text>
</svg>
